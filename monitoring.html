<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Monitoring Kehadiran Siswa</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f5f7fb;
    margin:0;
    padding:20px;
}

.container{
    max-width:1200px;
    margin:auto;
}

.header{
    background:#14532d;
    color:white;
    padding:25px;
    border-radius:15px;
    margin-bottom:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:15px;
    margin-bottom:20px;
}

select,input{
    padding:12px;
    border:1px solid #ddd;
    border-radius:8px;
    margin-right:10px;
    font-size:15px;
}


table{
    width:100%;
    border-collapse:collapse;
}


th{
    background:#14532d;
    color:white;
    padding:12px;
}


td{
    padding:10px;
    border-bottom:1px solid #eee;
    text-align:center;
}


.nama{
    text-align:left;
    font-weight:bold;
}


.hadir{
    color:green;
    font-weight:bold;
}


.alpa{
    color:red;
    font-weight:bold;
}


.dispensasi{
    color:#d97706;
    font-weight:bold;
}


.terlambat{
    color:#ca8a04;
    font-weight:bold;
}


</style>

</head>


<body>


<div class="container">


<div class="header">

<h2>
📚 Monitoring Kehadiran Siswa
</h2>

<p id="tanggal">
Memuat tanggal...
</p>

</div>



<div class="card">

<select id="filterKelas" onchange="tampilkan()">

<option value="">
Semua Kelas
</option>

</select>


<input 
id="search"
placeholder="Cari nama siswa..."
onkeyup="tampilkan()">


</div>



<div class="card">


<table>

<thead id="thead"></thead>

<tbody id="tbody">

<tr>
<td>
Memuat data...
</td>
</tr>

</tbody>

</table>


</div>


</div>



<script>


const API = 
"https://script.google.com/macros/s/AKfycbzMINLAmz6Wd5d5QvdDefkLNtmkECDPOFZg2D1YUhjS5uQKDys2gbqjG-0AAIIvyi6h-g/exec";


let dataSiswa=[];



async function ambilData(){

try{


const response = await fetch(API,{

method:"POST",

body:JSON.stringify({

action:"publicMonitoring"

})

});



const hasil = await response.json();


console.log("HASIL API:",hasil);



if(!hasil.data){

throw new Error(
"API belum mengirim data monitoring"
);

}



dataSiswa = hasil.data;



document.getElementById("tanggal").innerHTML =
"📅 "+hasil.tanggal;



buatFilter();


tampilkan();



}

catch(error){


console.error(error);


document.getElementById("tbody").innerHTML =

`
<tr>
<td>
Gagal mengambil data
<br>
${error.message}
</td>
</tr>
`;


}



}




function buatFilter(){


const select =
document.getElementById("filterKelas");


const kelas =
[
...new Set(
dataSiswa.map(x=>x.kelas)
)
];


kelas.sort();



kelas.forEach(k=>{


const option =
document.createElement("option");


option.value=k;

option.textContent=k;


select.appendChild(option);


});


}





function tampilkan(){


const kelas =
document.getElementById("filterKelas").value;


const cari =
document.getElementById("search").value
.toLowerCase();



let data =
dataSiswa.filter(s=>{


return (

(kelas=="" || s.kelas==kelas)

&&

s.nama
.toLowerCase()
.includes(cari)

);


});



data.sort((a,b)=>
a.nama.localeCompare(b.nama)
);



buatTabel(data);



}




function buatTabel(data){


if(data.length==0){

document.getElementById("tbody").innerHTML=

`
<tr>
<td>
Data kosong
</td>
</tr>
`;

return;

}



const kegiatan =
Object.keys(
data[0].kegiatan
);



let header = `

<tr>

<th>No</th>

<th>Nama</th>

<th>Kelas</th>

`;



kegiatan.forEach(k=>{

header +=

`
<th>${k}</th>
`;

});


header += "</tr>";



document.getElementById("thead").innerHTML =
header;




let isi="";



data.forEach((s,index)=>{


isi += `

<tr>

<td>${index+1}</td>

<td class="nama">
${s.nama}
</td>

<td>
${s.kelas}
</td>

`;



kegiatan.forEach(k=>{


const d=s.kegiatan[k];



isi +=

`

<td class="${warna(d.status)}">

${d.status}

<br>

<small>
${d.jam}
</small>

</td>

`;

});


isi += "</tr>";



});



document.getElementById("tbody").innerHTML=
isi;



}




function warna(status){


status=status.toLowerCase();


if(status.includes("hadir"))
return "hadir";


if(status.includes("alpa"))
return "alpa";


if(status.includes("dispensasi"))
return "dispensasi";


if(status.includes("terlambat"))
return "terlambat";


return "";

}




ambilData();


</script>


</body>

</html>
