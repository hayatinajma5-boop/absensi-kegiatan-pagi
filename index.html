<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presensi Pagi</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f7f5;
  color: #222;
  padding: 15px;
}

.container {
  max-width: 540px;
  margin: auto;
}

.header {
  text-align: center;
  margin-bottom: 15px;
}

h1 {
  margin: 0 0 4px;
  color: #1b5e20;
  font-size: 25px;
}

h2 {
  margin: 0;
  color: #555;
  font-size: 17px;
}

.tanggal {
  margin-top: 9px;
  color: #777;
  font-size: 14px;
}

.card {
  background: white;
  border-radius: 15px;
  padding: 17px;
  margin-bottom: 14px;
  box-shadow: 0 3px 10px rgba(0,0,0,.07);
}

button {
  width: 100%;
  border: none;
  border-radius: 10px;
  padding: 14px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  background: #1b5e20;
  color: white;
  margin-top: 10px;
}

button.secondary {
  background: #eee;
  color: #333;
}

button.stop {
  background: #b71c1c;
}

button.logout {
  width: auto;
  margin: 0;
  padding: 8px 12px;
  background: #eee;
  color: #555;
  font-size: 13px;
}

button.haid-action {
  background: #ad1457;
  color: white;
}

button.haid-action:disabled {
  opacity: .6;
  cursor: default;
}

select,
input,
textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 9px;
  font-size: 16px;
  background: white;
}

textarea {
  min-height: 70px;
  resize: vertical;
}

label {
  display: block;
  font-weight: bold;
  margin: 12px 0 6px;
}

.petugas {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px;
  background: #e8f5e9;
  border-radius: 12px;
  margin-bottom: 14px;
}

.petugas b {
  color: #1b5e20;
}

.jadwal {
  text-align: center;
}

.kegiatan {
  color: #1b5e20;
  font-size: 24px;
  font-weight: bold;
}

.status-waktu {
  display: inline-block;
  margin-top: 8px;
  padding: 7px 12px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: bold;
}

.buka {
  color: #1b5e20;
  background: #e8f5e9;
}

.telat {
  color: #e65100;
  background: #fff3e0;
}

.tutup {
  color: #555;
  background: #eee;
}

/* MENU */
.menu {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 14px;
}

.menu button {
  margin: 0;
}

.menu .wide {
  grid-column: 1 / 3;
}

/* CAMERA */
.camera-box {
  position: relative;
  overflow: hidden;
  border-radius: 15px;
  background: #000;
}

video {
  width: 100%;
  min-height: 275px;
  display: block;
  object-fit: cover;
}

/* TOMBOL FLIP KAMERA */
.flip-camera {
  position: absolute;
  top: 12px;
  right: 12px;
  width: 52px;
  height: 52px;
  margin: 0;
  padding: 0;
  border: none;
  border-radius: 50%;
  background: rgba(0,0,0,.58);
  color: #fff;
  font-size: 25px;
  line-height: 1;
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 20;
  box-shadow: 0 3px 12px rgba(0,0,0,.28);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.flip-camera.show {
  display: flex;
}

.flip-camera:active {
  transform: scale(.94);
}

.flip-camera:disabled {
  opacity: .55;
  cursor: default;
}

.center {
  text-align: center;
}

.hasil {
  display: none;
  background: white;
  padding: 17px;
  border-radius: 14px;
  margin-top: 12px;
  text-align: center;
}

.nama-siswa {
  font-size: 21px;
  font-weight: bold;
  margin: 6px 0;
}

.sukses { color: #1b5e20; }
.warning { color: #e65100; }
.error { color: #b71c1c; }

/* DASHBOARD */
.grid-status {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  margin-bottom: 13px;
}

.stat {
  padding: 12px 8px;
  border-radius: 11px;
  background: #f5f5f5;
  text-align: center;
}

.stat .angka {
  font-size: 23px;
  font-weight: bold;
  color: #1b5e20;
}

.stat small {
  color: #666;
}

.filter-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 10px;
}

.siswa-status {
  background: white;
  border: 1px solid #ddd;
  border-radius: 11px;
  padding: 12px;
  margin-bottom: 8px;
}

.siswa-top {
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

.siswa-info {
  flex: 1;
}

.siswa-info b {
  display: block;
  margin-bottom: 3px;
}

.siswa-info small {
  color: #666;
}

.badge {
  display: inline-block;
  padding: 5px 8px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: bold;
  white-space: nowrap;
}

.badge-hadir {
  background: #e8f5e9;
  color: #1b5e20;
}

.badge-terlambat {
  background: #fff3e0;
  color: #e65100;
}

.badge-absen {
  background: #ffebee;
  color: #b71c1c;
}

.badge-lain {
  background: #e3f2fd;
  color: #1565c0;
}

.btn-kecil {
  padding: 8px;
  font-size: 13px;
  margin-top: 8px;
}

#halamanApp,
#halamanManual,
#halamanStatus {
  display: none;
}

#panelUbahStatus {
  display: none;
  border: 2px solid #1b5e20;
}


/* TOAST HASIL SCAN QR */
#toastQR {
  position: fixed;
  left: 50%;
  bottom: 28px;
  transform: translateX(-50%) translateY(24px);
  width: calc(100% - 30px);
  max-width: 510px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  border-radius: 18px;
  box-shadow: 0 8px 26px rgba(0,0,0,.22);
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  z-index: 9999;
  transition: opacity .18s ease, transform .18s ease, visibility .18s ease;
}

#toastQR.show {
  opacity: 1;
  visibility: visible;
  transform: translateX(-50%) translateY(0);
}

#toastQR.success {
  background: #e8f5e9;
  color: #1b5e20;
  border-left: 6px solid #1b5e20;
}

#toastQR.warning {
  background: #fff3e0;
  color: #e65100;
  border-left: 6px solid #e65100;
}

#toastQR.error {
  background: #ffebee;
  color: #b71c1c;
  border-left: 6px solid #b71c1c;
}

.toast-qr-icon {
  flex: 0 0 auto;
  font-size: 28px;
  line-height: 1;
}

.toast-qr-text {
  flex: 1;
  min-width: 0;
}

.toast-qr-title {
  font-size: 16px;
  font-weight: bold;
  line-height: 1.25;
}

.toast-qr-message {
  margin-top: 3px;
  font-size: 14px;
  line-height: 1.35;
  overflow-wrap: anywhere;
}

/* Hasil QR sekarang ditampilkan melalui toast agar kamera tetap lapang. */
#hasilQR {
  display: none !important;
}

</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>SMP ISLAM CIPAKU</h1>
    <h2>PRESENSI PAGI</h2>
    <div class="tanggal" id="tanggal"></div>
  </div>

  <!-- LOGIN -->
  <div id="halamanLogin">
    <div class="card">
      <h3 class="center sukses">LOGIN PETUGAS</h3>

      <div id="loadingGuru">Memuat daftar guru...</div>

      <div id="formLogin" style="display:none;">
        <label>Nama Guru</label>

        <select id="guru">
          <option value="">-- Pilih nama guru --</option>
        </select>

        <label>PIN</label>

        <input
          id="pin"
          type="password"
          inputmode="numeric"
          maxlength="4"
          placeholder="••••"
        >

        <button id="login">MASUK</button>
        <div id="pesanLogin" class="center error"></div>
      </div>
    </div>
  </div>

  <!-- APP -->
  <div id="halamanApp">

    <div class="petugas">
      <div>
        <small>PETUGAS</small><br>
        <b id="namaPetugas"></b>
      </div>

      <button id="logout" class="logout">Keluar</button>
    </div>

    <div class="card jadwal">
      <small>KEGIATAN SAAT INI</small>

      <div class="kegiatan" id="kegiatan">
        Memuat...
      </div>

      <div id="jam"></div>

      <div id="statusWaktu" class="status-waktu tutup">
        Memuat...
      </div>
    </div>

    <!-- MENU UTAMA -->
    <div class="menu">
      <button id="menuQR">📷 SCAN QR</button>

      <button id="menuManual" class="secondary">
        ✍️ ABSEN MANUAL
      </button>

      <button id="menuStatus" class="secondary">
        👥 KEHADIRAN
      </button>

      <button id="menuRekap" class="secondary">
        📊 REKAP & EXPORT
      </button>

      <button id="menuAdmin" class="secondary wide">
        ⚙️ ADMIN / DATA SISWA
      </button>
    </div>

    <!-- QR -->
    <div id="halamanQR">

      <div class="card center">
        Presensi sesi ini:
        <b id="counter" class="sukses">0</b>
      </div>

      <div class="camera-box">
        <video id="qr-video"></video>

        <button
          id="flipCamera"
          class="flip-camera"
          type="button"
          aria-label="Balik kamera"
          title="Balik kamera"
        >🔄</button>
      </div>

      <button id="mulaiScan">📷 MULAI SCAN</button>

      <div id="statusScanner" class="center">
        Kamera belum dinyalakan.
      </div>

      <div id="hasilQR" class="hasil">
        <h3 id="judulQR"></h3>
        <div id="namaQR" class="nama-siswa"></div>
        <div id="kelasQR"></div>
        <div id="detailQR"></div>
      </div>

    </div>

    <!-- MANUAL -->
    <div id="halamanManual">

      <div class="card">
        <h3>✍️ Absen Manual</h3>

        <input
          id="pencarian"
          placeholder="Nama / NIS / ID siswa"
        >

        <button id="cariSiswa">🔎 CARI SISWA</button>

        <div id="hasilCari"></div>

        <div id="formManual" style="display:none;">
          <div id="siswaManual" class="card"></div>

          <label>Alasan</label>

          <select id="alasan">
            <option>Lupa membawa kartu</option>
            <option>Kartu hilang</option>
            <option>Kartu rusak</option>
            <option>QR tidak terbaca</option>
            <option value="Lainnya">Lainnya</option>
          </select>

          <input
            id="alasanLain"
            style="display:none;margin-top:8px;"
            placeholder="Tuliskan alasan"
          >

          <button id="simpanManual">✅ CATAT PRESENSI</button>
        </div>

        <div id="hasilManual" class="hasil"></div>
      </div>

    </div>

    <!-- STATUS -->
    <div id="halamanStatus">

      <div class="grid-status">

        <div class="stat">
          <div class="angka" id="stTotal">0</div>
          <small>Total Siswa</small>
        </div>

        <div class="stat">
          <div class="angka" id="stHadir">0</div>
          <small>Hadir</small>
        </div>

        <div class="stat">
          <div class="angka" id="stTerlambat">0</div>
          <small>Terlambat</small>
        </div>

        <div class="stat">
          <div class="angka" id="stBelum">0</div>
          <small id="labelBelum">Belum Absen</small>
        </div>

        <div class="stat">
          <div class="angka" id="stSakit">0</div>
          <small>Sakit</small>
        </div>

        <div class="stat">
          <div class="angka" id="stIzin">0</div>
          <small>Izin</small>
        </div>

        <div class="stat">
          <div class="angka" id="stAlpa">0</div>
          <small>Alpa</small>
        </div>

        <div class="stat">
          <div class="angka" id="stHaid">0</div>
          <small>Haid</small>
        </div>

      </div>

      <div class="card">

        <div class="filter-row">

          <select id="filterKelas">
            <option value="">Semua Kelas</option>
          </select>

          <select id="filterStatus">
            <option value="PERLU">Belum / Tidak Hadir</option>
            <option value="">Semua Status</option>
            <option value="Hadir">Hadir</option>
            <option value="Terlambat">Terlambat</option>
            <option value="Sakit">Sakit</option>
            <option value="Izin">Izin</option>
            <option value="Alpa">Alpa</option>
            <option value="Haid">Haid</option>
          </select>

        </div>

        <input
          id="cariStatus"
          placeholder="Cari nama siswa..."
        >

        <button id="refreshStatus">🔄 PERBARUI DATA</button>
      </div>

      <!-- FORM UBAH STATUS -->
      <div id="panelUbahStatus" class="card">

        <h3>Ubah Status</h3>

        <div id="namaUbah" class="nama-siswa"></div>
        <div id="infoUbah"></div>

        <label>Status Baru</label>

        <select id="statusBaru">
          <option value="HADIR">Hadir</option>
          <option value="SAKIT">Sakit</option>
          <option value="IZIN">Izin</option>
          <option value="ALPA">Alpa</option>
          <option value="TERLAMBAT">Terlambat</option>
        </select>

        <label>Catatan</label>

        <textarea
          id="catatanStatus"
          placeholder="Opsional, misalnya: surat dari orang tua"
        ></textarea>

        <button
          id="mulaiHaid"
          class="haid-action"
          type="button"
          style="display:none;"
        >
          🌸 MULAI HAID
        </button>

        <button id="simpanStatus">✅ SIMPAN PERUBAHAN</button>

        <button id="batalStatus" class="secondary">
          BATAL
        </button>

      </div>

      <div id="loadingStatus" class="center"></div>
      <div id="daftarStatus"></div>

    </div>

  </div>

</div>




<!-- POPUP / TOAST HASIL SCAN QR -->
<div id="toastQR" role="status" aria-live="polite">
  <div id="toastQRIcon" class="toast-qr-icon">✅</div>
  <div class="toast-qr-text">
    <div id="toastQRTitle" class="toast-qr-title">Presensi berhasil</div>
    <div id="toastQRMessage" class="toast-qr-message"></div>
  </div>
</div>

<script type="module">

import QrScanner from
"https://cdn.jsdelivr.net/npm/qr-scanner@1.4.2/qr-scanner.min.js";

const API =
"https://script.google.com/macros/s/AKfycbzMINLAmz6Wd5d5QvdDefkLNtmkECDPOFZg2D1YUhjS5uQKDys2gbqjG-0AAIIvyi6h-g/exec";

let token =
  localStorage.getItem("absensi_token") || "";

let namaGuru =
  localStorage.getItem("absensi_guru") || "";

let kegiatanAktif = "";
let scannerAktif = false;
let proses = false;
let totalScan = 0;

// Optimasi scanner QR
let qrTerakhir = "";
let timerResetQR = null;
let audioContext = null;
let timerToast = null;
let toastQrAktif = "";

// Status kamera untuk tombol flip
let kameraDepan = false;
let sedangGantiKamera = false;

let siswaManual = null;
let dataStatus = [];
let siswaUbah = null;


/* UTIL */
function post(data) {
  return fetch(
    API,
    {
      method: "POST",
      headers: {
        "Content-Type": "text/plain;charset=UTF-8"
      },
      body: JSON.stringify(data)
    }
  )
  .then(r => r.json())
  .catch(() => ({
    berhasil: false,
    pesan: "Tidak dapat terhubung ke server."
  }));
}

function keluarLocal() {
  localStorage.removeItem("absensi_token");
  localStorage.removeItem("absensi_guru");
  location.reload();
}

function cekLoginHabis(d) {
  if (d && d.harusLogin) {
    alert("Sesi login habis. Silakan login kembali.");
    keluarLocal();
    return true;
  }
  return false;
}


/* TANGGAL */
document.getElementById("tanggal").textContent =
  new Date().toLocaleDateString(
    "id-ID",
    {
      weekday: "long",
      day: "numeric",
      month: "long",
      year: "numeric"
    }
  );


/* LOGIN */
async function loadGuru() {
  try {
    const r =
      await fetch(API + "?action=daftarGuru");

    const d = await r.json();

    const select =
      document.getElementById("guru");

    d.data.forEach(g => {
      const op =
        document.createElement("option");

      op.value = g.id;
      op.textContent = g.nama;
      select.appendChild(op);
    });

    document.getElementById("loadingGuru").style.display =
      "none";

    document.getElementById("formLogin").style.display =
      "block";

  } catch {
    document.getElementById("loadingGuru").textContent =
      "Gagal memuat guru.";
  }
}

loadGuru();

document.getElementById("login").onclick =
async function() {

  const idGuru =
    document.getElementById("guru").value;

  const pin =
    document.getElementById("pin").value;

  const d =
    await post({
      action: "loginGuru",
      idGuru: idGuru,
      pin: pin
    });

  if (!d.berhasil) {
    document.getElementById("pesanLogin").textContent =
      d.pesan;
    return;
  }

  token = d.token;
  namaGuru = d.guru.nama;

  localStorage.setItem("absensi_token", token);
  localStorage.setItem("absensi_guru", namaGuru);

  bukaApp();
};

document.getElementById("pin").addEventListener(
  "keydown",
  e => {
    if (e.key === "Enter") {
      document.getElementById("login").click();
    }
  }
);


/* APP */
function bukaApp() {
  document.getElementById("halamanLogin").style.display =
    "none";

  document.getElementById("halamanApp").style.display =
    "block";

  document.getElementById("namaPetugas").textContent =
    namaGuru;

  loadKegiatan();
}

if (token && namaGuru) {
  bukaApp();
}


/* LOGOUT */
document.getElementById("logout").onclick =
async function() {

  scannerAktif = false;
  scanner.stop();

  await post({
    action: "logoutGuru",
    token: token
  });

  keluarLocal();
};


/* JADWAL */
async function loadKegiatan() {
  try {
    const r =
      await fetch(API + "?action=kegiatanSekarang");

    const d = await r.json();

    const kegiatan =
      document.getElementById("kegiatan");

    const jam =
      document.getElementById("jam");

    const sw =
      document.getElementById("statusWaktu");

    if (d.berhasil && d.adaKegiatan) {
      kegiatanAktif = d.kegiatan;
      kegiatan.textContent = d.kegiatan;
      jam.textContent = d.mulai + " - " + d.tutup;

      if (
        d.statusWaktu === "SEDANG BERLANGSUNG"
      ) {
        sw.textContent = "🟢 ABSENSI DIBUKA";
        sw.className = "status-waktu buka";
      } else {
        sw.textContent = "🟠 TERLAMBAT";
        sw.className = "status-waktu telat";
      }

      return;
    }

    kegiatanAktif = "";
    kegiatan.textContent = "Tidak Ada Kegiatan";
    jam.textContent = "";

    sw.textContent =
      d.pesan || "Tidak ada kegiatan.";

    sw.className = "status-waktu tutup";

  } catch {
    kegiatanAktif = "";
  }
}


/* MENU */
function bukaMenu(nama) {

  document.getElementById("halamanQR").style.display =
    nama === "QR" ? "block" : "none";

  document.getElementById("halamanManual").style.display =
    nama === "MANUAL" ? "block" : "none";

  document.getElementById("halamanStatus").style.display =
    nama === "STATUS" ? "block" : "none";

  if (
    nama !== "QR" &&
    scannerAktif
  ) {
    scannerAktif = false;
    scanner.stop();

    document.getElementById("flipCamera").classList.remove(
      "show"
    );

    document.getElementById("mulaiScan").textContent =
      "📷 MULAI SCAN";
  }

  if (nama === "STATUS") {
    loadStatus();
  }
}

document.getElementById("menuQR").onclick =
  () => bukaMenu("QR");

document.getElementById("menuManual").onclick =
  () => bukaMenu("MANUAL");

document.getElementById("menuStatus").onclick =
  () => bukaMenu("STATUS");

/* REKAP LANGSUNG KE HALAMAN REKAP */
document.getElementById("menuRekap").onclick =
function() {

  if (scannerAktif) {
    scannerAktif = false;
    scanner.stop();

    document.getElementById("flipCamera").classList.remove(
      "show"
    );
  }

  window.location.href =
    "./rekap.html";
};

/* ADMIN DATA SISWA */
document.getElementById("menuAdmin").onclick =
function() {

  if (scannerAktif) {
    scannerAktif = false;
    scanner.stop();

    document.getElementById("flipCamera").classList.remove(
      "show"
    );
  }

  window.location.href =
    "./admin.html";
};


/* QR */

/*
  Scanner tetap menyala selama sesi.

  Perilaku popup:
  - Popup muncul saat server mengonfirmasi hasil scan.
  - Selama QR yang sama masih terlihat kamera, popup tetap tampil.
  - Setelah QR tersebut tidak terlihat lagi, popup menghilang 0,8 detik kemudian.
  - Jika QR siswa berikutnya terbaca lebih dulu, popup baru langsung menggantikan popup lama.
*/
const scanner =
new QrScanner(

  document.getElementById("qr-video"),

  async hasil => {

    if (!scannerAktif) return;

    const idQR =
      String(hasil.data || "").trim();

    if (!idQR) return;

    /*
      Bila popup untuk QR ini sedang tampil, setiap kali kamera
      masih mendeteksi QR yang sama kita mulai ulang hitungan 0,8 detik.
      Artinya popup tidak hilang selama QR masih disorot.
    */
    if (toastQrAktif === idQR) {
      jadwalkanToastHilang(idQR);
    }

    /*
      QR yang sama tidak dikirim berkali-kali selama masih berada
      di depan kamera. Timer di-reset setiap kali QR yang sama masih terlihat.
    */
    if (idQR === qrTerakhir) {
      jadwalkanResetQR(idQR);
      return;
    }

    /*
      Bila request sebelumnya masih diproses, kamera tetap menyala.
      QR berikutnya akan terbaca lagi ketika request selesai jika masih diarahkan.
    */
    if (proses) return;

    qrTerakhir = idQR;
    jadwalkanResetQR(idQR);
    proses = true;

    document.getElementById("statusScanner").textContent =
      "QR terbaca. Menyimpan presensi...";

    const d =
      await post({
        action: "catatPresensi",
        idSiswa: idQR,
        kegiatan: kegiatanAktif,
        token: token,
        metode: "QR",
        alasan: "-"
      });

    tampilQR(d, idQR);

    proses = false;

    if (scannerAktif) {
      document.getElementById("statusScanner").textContent =
        "Siap scan siswa berikutnya.";
    }
  },

  {
    preferredCamera: "environment",
    highlightScanRegion: true,
    highlightCodeOutline: true,
    returnDetailedScanResult: true
  }
);


/*
  QR yang sama baru boleh diproses lagi setelah tidak terdeteksi
  selama 0,8 detik. Selama QR masih terlihat, callback scanner
  terus memperbarui timer ini.
*/
function jadwalkanResetQR(idQR) {

  if (timerResetQR) {
    clearTimeout(timerResetQR);
  }

  timerResetQR = setTimeout(() => {
    if (qrTerakhir === idQR) {
      qrTerakhir = "";
    }
    timerResetQR = null;
  }, 800);
}


/*
  AudioContext disiapkan dari klik tombol MULAI SCAN.
  Ini lebih kompatibel dengan browser HP dibanding membuat
  AudioContext baru setiap kali QR berhasil.
*/
function siapkanAudio() {

  const AudioCtx =
    window.AudioContext ||
    window.webkitAudioContext;

  if (!AudioCtx) return;

  try {
    if (!audioContext) {
      audioContext =
        new AudioCtx();
    }

    if (audioContext.state === "suspended") {
      audioContext.resume().catch(() => {});
    }
  } catch {
    audioContext = null;
  }
}


function bunyiBerhasil() {

  if (!audioContext) return;

  try {
    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    const mulai =
      audioContext.currentTime;

    oscillator.type =
      "sine";

    oscillator.frequency.setValueAtTime(
      1150,
      mulai
    );

    gain.gain.setValueAtTime(
      0.12,
      mulai
    );

    gain.gain.exponentialRampToValueAtTime(
      0.001,
      mulai + 0.12
    );

    oscillator.start(mulai);
    oscillator.stop(mulai + 0.12);

  } catch {
    // Jika perangkat tidak mendukung audio, presensi tetap berjalan.
  }
}


/*
  Menjadwalkan popup hilang 0,8 detik setelah QR terakhir kali
  terlihat. Jika QR yang sama masih terlihat, fungsi ini dipanggil
  lagi dan hitungan 0,8 detik dimulai ulang.
*/
function jadwalkanToastHilang(idQR) {

  if (timerToast) {
    clearTimeout(timerToast);
  }

  timerToast = setTimeout(() => {
    if (toastQrAktif === idQR) {
      sembunyikanToastQR();
    }
  }, 800);
}


function tampilToastQR(tipe, judul, pesan, idQR) {

  const toast =
    document.getElementById("toastQR");

  const icon =
    document.getElementById("toastQRIcon");

  const title =
    document.getElementById("toastQRTitle");

  const message =
    document.getElementById("toastQRMessage");

  const ikon = {
    success: "✅",
    warning: "⚠️",
    error: "❌"
  };

  if (timerToast) {
    clearTimeout(timerToast);
    timerToast = null;
  }

  toastQrAktif = idQR || "";

  toast.className = tipe;
  icon.textContent = ikon[tipe] || "ℹ️";
  title.textContent = judul;
  message.textContent = pesan || "";

  // Memaksa browser membaca state awal agar animasi tetap muncul
  // walaupun scan dilakukan berurutan dengan cepat.
  void toast.offsetWidth;
  toast.classList.add("show");

  /*
    Jika QR langsung dipindahkan setelah bunyi, popup tetap terlihat
    selama 0,8 detik. Jika QR masih terlihat, callback scanner akan
    terus memperbarui timer ini sehingga popup tetap tampil.
  */
  jadwalkanToastHilang(toastQrAktif);
}


function sembunyikanToastQR() {

  const toast =
    document.getElementById("toastQR");

  if (timerToast) {
    clearTimeout(timerToast);
    timerToast = null;
  }

  toast.classList.remove("show");
  toastQrAktif = "";
}


/*
  FLIP KAMERA
  - Default mengikuti preferredCamera: environment (kamera belakang).
  - Tekan tombol untuk pindah ke kamera depan.
  - Tekan lagi untuk kembali ke kamera belakang.
  - Scanner tetap berada pada halaman yang sama.
*/
document.getElementById("flipCamera").onclick =
async function() {

  if (!scannerAktif || sedangGantiKamera) return;

  sedangGantiKamera = true;
  this.disabled = true;

  const target =
    kameraDepan
      ? "environment"
      : "user";

  const status =
    document.getElementById("statusScanner");

  status.textContent =
    target === "user"
      ? "Mengganti ke kamera depan..."
      : "Mengganti ke kamera belakang...";

  try {

    await scanner.setCamera(target);

    kameraDepan =
      target === "user";

    this.setAttribute(
      "aria-label",
      kameraDepan
        ? "Gunakan kamera belakang"
        : "Gunakan kamera depan"
    );

    this.title =
      kameraDepan
        ? "Gunakan kamera belakang"
        : "Gunakan kamera depan";

    status.textContent =
      kameraDepan
        ? "Kamera depan aktif. Siap scan siswa."
        : "Kamera belakang aktif. Siap scan siswa.";

    /*
      Setelah kamera berganti, lepaskan kunci QR lama agar
      QR berikutnya dapat diproses normal.
    */
    qrTerakhir = "";

    if (timerResetQR) {
      clearTimeout(timerResetQR);
      timerResetQR = null;
    }

  } catch {

    status.textContent =
      "Kamera tidak dapat diganti pada perangkat ini.";

  } finally {

    sedangGantiKamera = false;
    this.disabled = false;
  }
};


document.getElementById("mulaiScan").onclick =
async function() {

  if (scannerAktif) {
    scannerAktif = false;
    proses = false;

    scanner.stop();

    if (timerResetQR) {
      clearTimeout(timerResetQR);
      timerResetQR = null;
    }

    qrTerakhir = "";
    sembunyikanToastQR();

    document.getElementById("hasilQR").style.display =
      "none";

    document.getElementById("statusScanner").textContent =
      "Scanner dihentikan.";

    document.getElementById("flipCamera").classList.remove(
      "show"
    );

    this.textContent =
      "📷 MULAI SCAN";

    this.className =
      "";

    return;
  }

  if (!kegiatanAktif) {
    document.getElementById("statusScanner").textContent =
      "❌ Tidak ada kegiatan aktif.";
    return;
  }

  try {

    /*
      Dipanggil saat guru menekan tombol agar browser HP
      mengizinkan bunyi beep.
    */
    siapkanAudio();

    qrTerakhir = "";
    proses = false;

    if (timerResetQR) {
      clearTimeout(timerResetQR);
      timerResetQR = null;
    }

    sembunyikanToastQR();

    await scanner.start();

    scannerAktif = true;

    document.getElementById("flipCamera").classList.add(
      "show"
    );

    this.textContent =
      "⏹ SELESAI SCAN";

    this.className =
      "stop";

    document.getElementById("statusScanner").textContent =
      "Scanner aktif. Arahkan kamera ke QR siswa.";

  } catch {
    scannerAktif = false;

    document.getElementById("statusScanner").textContent =
      "Kamera gagal dibuka. Pastikan izin kamera sudah diberikan.";
  }
};


function tampilQR(d, idQR) {

  if (cekLoginHabis(d)) return;

  // Kotak hasil lama tidak dipakai pada mode popup.
  document.getElementById("hasilQR").style.display =
    "none";

  if (d.berhasil) {

    totalScan++;

    document.getElementById("counter").textContent =
      totalScan;

    tampilToastQR(
      "success",
      "Presensi berhasil",
      (d.nama || "Siswa") +
      " • Kelas " + (d.kelas || "-") +
      " • " + (d.status || "Tercatat"),
      idQR
    );

    // Popup, beep, dan getar diberikan pada momen yang sama.
    bunyiBerhasil();

    if (navigator.vibrate) {
      navigator.vibrate(100);
    }

  } else if (d.sudahAbsen) {

    tampilToastQR(
      "warning",
      "Sudah absen",
      (d.nama || "Siswa") +
      (d.jamSebelumnya
        ? " • Tercatat pukul " + d.jamSebelumnya
        : " • Presensi sudah tercatat"),
      idQR
    );

  } else {

    tampilToastQR(
      "error",
      "Presensi gagal",
      d.pesan || "Data siswa tidak ditemukan.",
      idQR
    );
  }
}


/* ABSEN MANUAL */
document.getElementById("alasan").onchange =
function() {

  document.getElementById("alasanLain").style.display =
    this.value === "Lainnya"
      ? "block"
      : "none";
};

document.getElementById("cariSiswa").onclick =
async function() {

  const q =
    document.getElementById("pencarian").value.trim();

  const tempat =
    document.getElementById("hasilCari");

  siswaManual = null;

  document.getElementById("formManual").style.display =
    "none";

  if (q.length < 2) {
    tempat.innerHTML =
      '<p class="error">Ketik minimal 2 karakter.</p>';
    return;
  }

  tempat.innerHTML = "Mencari...";

  const d =
    await post({
      action: "cariSiswaManual",
      query: q,
      token: token
    });

  if (cekLoginHabis(d)) return;

  tempat.innerHTML = "";

  if (
    !d.berhasil ||
    d.data.length === 0
  ) {
    tempat.innerHTML =
      '<p class="error">Siswa tidak ditemukan.</p>';
    return;
  }

  d.data.forEach(
    s => {

      const div =
        document.createElement("div");

      div.className =
        "siswa-status";

      div.innerHTML =
        "<b>" + s.nama + "</b><br>" +
        "<small>" +
        s.kelas +
        " • " +
        s.id +
        " • NIS " +
        s.nis +
        "</small>";

      div.onclick =
      function() {

        siswaManual = s;

        document.getElementById("siswaManual").innerHTML =
          "<b>" +
          s.nama +
          "</b><br>Kelas " +
          s.kelas +
          " • " +
          s.id;

        document.getElementById("formManual").style.display =
          "block";
      };

      tempat.appendChild(div);
    }
  );
};

document.getElementById("simpanManual").onclick =
async function() {

  if (!siswaManual) return;

  if (!kegiatanAktif) {
    alert("Tidak ada kegiatan aktif.");
    return;
  }

  let alasan =
    document.getElementById("alasan").value;

  if (alasan === "Lainnya") {
    alasan =
      document.getElementById("alasanLain").value.trim();

    if (!alasan) {
      alert("Tuliskan alasan.");
      return;
    }
  }

  const d =
    await post({
      action: "catatPresensi",
      idSiswa: siswaManual.id,
      kegiatan: kegiatanAktif,
      token: token,
      metode: "MANUAL",
      alasan: alasan
    });

  if (cekLoginHabis(d)) return;

  const box =
    document.getElementById("hasilManual");

  box.style.display = "block";

  if (d.berhasil) {
    box.innerHTML =
      '<h3 class="sukses">✅ PRESENSI BERHASIL</h3>' +
      '<div class="nama-siswa">' +
      d.nama +
      '</div>' +
      'Kelas ' +
      d.kelas +
      '<br>Status: <b>' +
      d.status +
      '</b><br>Alasan: <b>' +
      d.alasan +
      '</b>';

  } else if (d.sudahAbsen) {

    box.innerHTML =
      '<h3 class="warning">⚠️ SUDAH ABSEN</h3>' +
      d.nama;

  } else {

    box.innerHTML =
      '<h3 class="error">❌ GAGAL</h3>' +
      d.pesan;
  }
};


/* DASHBOARD STATUS */
async function loadStatus() {

  if (!kegiatanAktif) {
    document.getElementById("loadingStatus").textContent =
      "Tidak ada kegiatan aktif.";
    return;
  }

  document.getElementById("loadingStatus").textContent =
    "Memuat data kehadiran...";

  const d =
    await post({
      action: "statusKegiatan",
      kegiatan: kegiatanAktif,
      token: token
    });

  if (cekLoginHabis(d)) return;

  if (!d.berhasil) {
    document.getElementById("loadingStatus").textContent =
      d.pesan;
    return;
  }

  document.getElementById("loadingStatus").textContent =
    "";

  dataStatus = d.data;

  const r = d.ringkasan;

  document.getElementById("stTotal").textContent =
    r.total;

  document.getElementById("stHadir").textContent =
    r.hadir;

  document.getElementById("stTerlambat").textContent =
    r.terlambat;

  document.getElementById("stSakit").textContent =
    r.sakit;

  document.getElementById("stIzin").textContent =
    r.izin;

  document.getElementById("stAlpa").textContent =
    r.alpa;

  document.getElementById("stHaid").textContent =
    r.haid;

  if (r.belumAbsen > 0) {
    document.getElementById("stBelum").textContent =
      r.belumAbsen;

    document.getElementById("labelBelum").textContent =
      "Belum Absen";

  } else {

    document.getElementById("stBelum").textContent =
      r.tidakHadir;

    document.getElementById("labelBelum").textContent =
      "Tidak Hadir";
  }

  const select =
    document.getElementById("filterKelas");

  const nilaiLama =
    select.value;

  const kelas =
    [
      ...new Set(
        dataStatus.map(
          x => x.kelas
        )
      )
    ];

  kelas.sort(
    (a,b) =>
      a.localeCompare(
        b,
        "id",
        {numeric:true}
      )
  );

  select.innerHTML =
    '<option value="">Semua Kelas</option>';

  kelas.forEach(
    k => {
      const op =
        document.createElement("option");

      op.value = k;
      op.textContent = k;

      select.appendChild(op);
    }
  );

  select.value = nilaiLama;

  renderStatus();
}

function renderStatus() {

  const kelas =
    document.getElementById("filterKelas").value;

  const status =
    document.getElementById("filterStatus").value;

  const cari =
    document.getElementById("cariStatus")
      .value
      .trim()
      .toLowerCase();

  const tempat =
    document.getElementById("daftarStatus");

  tempat.innerHTML = "";

  const hasil =
    dataStatus.filter(
      s => {

        if (
          kelas &&
          s.kelas !== kelas
        )
          return false;

        if (
          cari &&
          !s.nama
            .toLowerCase()
            .includes(cari)
        )
          return false;

        if (
          status === "PERLU"
        ) {
          return (
            s.status.toUpperCase() ===
              "BELUM ABSEN"
            ||
            s.status.toUpperCase() ===
              "TIDAK HADIR"
          );
        }

        if (
          status &&
          s.status.toLowerCase()
            !== status.toLowerCase()
        )
          return false;

        return true;
      }
    );

  if (hasil.length === 0) {
    tempat.innerHTML =
      '<div class="card center">Tidak ada siswa pada filter ini.</div>';
    return;
  }

  hasil.forEach(
    s => {

      const div =
        document.createElement("div");

      div.className =
        "siswa-status";

      let badgeClass =
        "badge-lain";

      const x =
        s.status.toUpperCase();

      if (x === "HADIR")
        badgeClass = "badge-hadir";

      else if (x === "TERLAMBAT")
        badgeClass = "badge-terlambat";

      else if (
        x === "BELUM ABSEN"
        ||
        x === "TIDAK HADIR"
        ||
        x === "ALPA"
      )
        badgeClass = "badge-absen";

      div.innerHTML =

        '<div class="siswa-top">' +

        '<div class="siswa-info">' +

        '<b>' +
        s.nama +
        '</b>' +

        '<small>' +
        s.kelas +
        ' • ' +
        s.id +
        '</small>' +

        '</div>' +

        '<span class="badge ' +
        badgeClass +
        '">' +
        s.status +
        '</span>' +

        '</div>';

      const tombol =
        document.createElement("button");

      tombol.className =
        "secondary btn-kecil";

      tombol.textContent =
        "✏️ Ubah Status";

      tombol.onclick =
        () => pilihUbahStatus(s);

      div.appendChild(tombol);
      tempat.appendChild(div);
    }
  );
}

document.getElementById("filterKelas").onchange =
  renderStatus;

document.getElementById("filterStatus").onchange =
  renderStatus;

document.getElementById("cariStatus").oninput =
  renderStatus;

document.getElementById("refreshStatus").onclick =
  loadStatus;


/* UBAH STATUS */
function pilihUbahStatus(s) {

  siswaUbah = s;

  document.getElementById("panelUbahStatus").style.display =
    "block";

  document.getElementById("namaUbah").textContent =
    s.nama;

  const keg =
    kegiatanAktif.toLowerCase();

  const salat =
    keg.includes("dhuha")
    ||
    keg.includes("dzuhur")
    ||
    keg.includes("zuhur");

  const perempuan =
    String(
      s.jk
    )
      .trim()
      .toUpperCase()
      === "P";

  const sedangHaid =
    String(
      s.status
    )
      .trim()
      .toUpperCase()
      === "HAID";

  let info =
    "Kelas " +
    s.kelas +
    " • Status sekarang: " +
    s.status;

  if (
    salat &&
    perempuan &&
    sedangHaid
  ) {

    info +=
      " • Saat sudah kembali sholat, cukup scan QR seperti biasa";

  }

  document.getElementById("infoUbah").textContent =
    info;

  const select =
    document.getElementById("statusBaru");

  select.innerHTML =
    '<option value="HADIR">Hadir</option>' +
    '<option value="SAKIT">Sakit</option>' +
    '<option value="IZIN">Izin</option>' +
    '<option value="ALPA">Alpa</option>' +
    '<option value="TERLAMBAT">Terlambat</option>';

  /*
   * Haid manual tetap tersedia sebagai cadangan.
   */

  if (
    perempuan &&
    salat
  ) {

    const option =
      document.createElement("option");

    option.value =
      "HAID";

    option.textContent =
      "Haid";

    select.appendChild(
      option
    );

  }


  /*
   * Tombol cepat hanya tampil untuk siswi pada Dhuha/Dzuhur
   * yang belum sedang berstatus Haid.
   */

  const tombolMulai =
    document.getElementById(
      "mulaiHaid"
    );

  tombolMulai.style.display =
    (
      perempuan &&
      salat &&
      !sedangHaid
    )
      ? "block"
      : "none";

  tombolMulai.disabled =
    false;

  tombolMulai.textContent =
    "🌸 MULAI HAID";


  document.getElementById("catatanStatus").value =
    "";

  document.getElementById("panelUbahStatus").scrollIntoView({
    behavior: "smooth",
    block: "start"
  });
}


document.getElementById("mulaiHaid").onclick =
async function() {

  if (!siswaUbah) return;

  const siswaSaatIni =
    siswaUbah;

  this.disabled =
    true;

  this.textContent =
    "MENYIMPAN...";


  const d =
    await post({
      action:
        "mulaiStatusHaid",
      idSiswa:
        siswaSaatIni.id,
      kegiatan:
        kegiatanAktif,
      token:
        token
    });


  this.disabled =
    false;

  this.textContent =
    "🌸 MULAI HAID";


  if (
    cekLoginHabis(
      d
    )
  ) {

    return;

  }


  if (
    !d.berhasil
  ) {

    alert(
      d.pesan ||
      "Gagal memulai status Haid."
    );

    return;

  }


  alert(
    d.pesan ||
    (
      "Status Haid " +
      d.nama +
      " berhasil dimulai."
    )
  );


  document.getElementById("panelUbahStatus").style.display =
    "none";

  siswaUbah =
    null;


  await loadStatus();

};


document.getElementById("batalStatus").onclick =
function() {

  siswaUbah = null;

  document.getElementById("panelUbahStatus").style.display =
    "none";
};

document.getElementById("simpanStatus").onclick =
async function() {

  if (!siswaUbah) return;

  const statusBaru =
    document.getElementById("statusBaru").value;

  const catatan =
    document.getElementById("catatanStatus")
      .value
      .trim();

  this.disabled = true;
  this.textContent = "MENYIMPAN...";

  const d =
    await post({
      action: "ubahStatus",
      idSiswa: siswaUbah.id,
      kegiatan: kegiatanAktif,
      statusBaru: statusBaru,
      catatan: catatan,
      token: token
    });

  this.disabled = false;
  this.textContent = "✅ SIMPAN PERUBAHAN";

  if (cekLoginHabis(d)) return;

  if (!d.berhasil) {
    alert(d.pesan);
    return;
  }

  alert(
    "Status " +
    d.nama +
    " berhasil diubah dari " +
    d.statusLama +
    " menjadi " +
    d.statusBaru +
    "."
  );

  document.getElementById("panelUbahStatus").style.display =
    "none";

  siswaUbah = null;

  await loadStatus();
};
