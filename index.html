<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Absensi Kegiatan Pagi</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7f5;
      text-align: center;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    h1 {
      color: #1b5e20;
      margin-bottom: 5px;
    }

    h2 {
      font-size: 18px;
      color: #555;
      margin-top: 0;
    }

    .camera-box {
      position: relative;
      margin-top: 20px;
      overflow: hidden;
      border-radius: 15px;
      background: #000;
    }

    video {
      width: 100%;
      display: block;
      min-height: 300px;
      object-fit: cover;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 20px;
      border: none;
      border-radius: 10px;
      background: #1b5e20;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #status {
      margin-top: 15px;
      font-size: 16px;
    }

    .hasil {
      margin-top: 20px;
      padding: 20px;
      background: white;
      border-radius: 12px;
      display: none;
    }

    .hasil h3 {
      margin-top: 0;
      color: #1b5e20;
    }

    #hasilQR {
      font-size: 28px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>SMP ISLAM CIPAKU</h1>
    <h2>ABSENSI KEGIATAN PAGI</h2>

    <div class="camera-box">
      <video id="qr-video"></video>
    </div>

    <button id="tombolScan">
      📷 MULAI SCAN QR
    </button>

    <p id="status">
      Kamera belum dinyalakan.
    </p>

    <div class="hasil" id="kotakHasil">
      <h3>QR BERHASIL DIBACA</h3>
      <div id="hasilQR">-</div>
    </div>

  </div>


  <script type="module">

    import QrScanner from
    "https://cdn.jsdelivr.net/npm/qr-scanner@1.4.2/qr-scanner.min.js";


    const video = document.getElementById("qr-video");
    const tombolScan = document.getElementById("tombolScan");
    const status = document.getElementById("status");
    const kotakHasil = document.getElementById("kotakHasil");
    const hasilQR = document.getElementById("hasilQR");

    let sedangScan = false;


    const scanner = new QrScanner(

      video,

      hasil => {

        const kode = hasil.data;

        hasilQR.textContent = kode;
        kotakHasil.style.display = "block";

        status.textContent = "✅ QR berhasil dibaca.";

        scanner.stop();

        sedangScan = false;

        tombolScan.textContent = "📷 SCAN LAGI";

        if (navigator.vibrate) {
          navigator.vibrate(150);
        }

      },

      {
        preferredCamera: "environment",
        highlightScanRegion: true,
        highlightCodeOutline: true,
        returnDetailedScanResult: true,
        maxScansPerSecond: 10
      }

    );


    tombolScan.addEventListener("click", async function () {

      if (sedangScan) {

        scanner.stop();

        sedangScan = false;

        tombolScan.textContent = "📷 MULAI SCAN QR";

        status.textContent = "Scanner dihentikan.";

        return;
      }


      try {

        kotakHasil.style.display = "none";

        status.textContent = "Membuka kamera...";

        await scanner.start();

        sedangScan = true;

        tombolScan.textContent = "⏹ HENTIKAN SCANNER";

        status.textContent =
          "Arahkan kamera ke QR siswa.";

      }

      catch (error) {

        console.error(error);

        status.textContent =
          "❌ Kamera tidak dapat dibuka. Pastikan izin kamera diberikan.";

      }

    });

  </script>

</body>
</html>
