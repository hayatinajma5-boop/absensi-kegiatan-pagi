<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Absensi Kegiatan Pagi</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7f5;
      text-align: center;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    h1 {
      color: #1b5e20;
      margin-bottom: 5px;
      font-size: 26px;
    }

    h2 {
      font-size: 18px;
      color: #555;
      margin-top: 0;
      margin-bottom: 20px;
    }

    .camera-box {
      position: relative;
      overflow: hidden;
      border-radius: 15px;
      background: #000;
    }

    video {
      width: 100%;
      display: block;
      min-height: 300px;
      object-fit: cover;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 20px;
      border: none;
      border-radius: 10px;
      background: #1b5e20;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #status {
      margin-top: 15px;
      font-size: 16px;
      line-height: 1.5;
    }

    .hasil {
      margin-top: 20px;
      padding: 22px;
      background: white;
      border-radius: 15px;
      display: none;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .hasil h3 {
      color: #1b5e20;
      margin-top: 0;
      margin-bottom: 10px;
    }

    .kode-qr {
      font-size: 14px;
      color: #777;
      margin-bottom: 15px;
    }

    .nama {
      font-size: 24px;
      font-weight: bold;
      color: #222;
      margin-bottom: 8px;
    }

    .kelas {
      font-size: 18px;
      color: #555;
    }

    .error {
      color: #b71c1c;
    }

    .sukses {
      color: #1b5e20;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>SMP ISLAM CIPAKU</h1>
    <h2>ABSENSI KEGIATAN PAGI</h2>

    <div class="camera-box">
      <video id="qr-video"></video>
    </div>

    <button id="tombolScan">
      📷 MULAI SCAN QR
    </button>

    <p id="status">
      Kamera belum dinyalakan.
    </p>

    <div class="hasil" id="kotakHasil">

      <h3 id="judulHasil">
        DATA SISWA
      </h3>

      <div class="kode-qr" id="kodeQR"></div>

      <div class="nama" id="namaSiswa"></div>

      <div class="kelas" id="kelasSiswa"></div>

    </div>

  </div>


  <script type="module">

    import QrScanner from
    "https://cdn.jsdelivr.net/npm/qr-scanner@1.4.2/qr-scanner.min.js";


    /*
     * ALAMAT BACKEND APPS SCRIPT
     */

    const API_URL =
      "https://script.google.com/macros/s/AKfycbzMINLAmz6Wd5d5QvdDefkLNtmkECDPOFZg2D1YUhjS5uQKDys2gbqjG-0AAIIvyi6h-g/exec";


    const video =
      document.getElementById("qr-video");

    const tombolScan =
      document.getElementById("tombolScan");

    const status =
      document.getElementById("status");

    const kotakHasil =
      document.getElementById("kotakHasil");

    const judulHasil =
      document.getElementById("judulHasil");

    const kodeQR =
      document.getElementById("kodeQR");

    const namaSiswa =
      document.getElementById("namaSiswa");

    const kelasSiswa =
      document.getElementById("kelasSiswa");


    let sedangScan = false;

    let sedangMemproses = false;


    /*
     * SCANNER QR
     */

    const scanner = new QrScanner(

      video,

      async hasil => {

        /*
         * Mencegah QR diproses berkali-kali
         */

        if (sedangMemproses) {
          return;
        }


        sedangMemproses = true;


        const kode =
          String(hasil.data || "").trim();


        /*
         * Hentikan kamera sementara
         */

        scanner.stop();

        sedangScan = false;


        tombolScan.textContent =
          "📷 SCAN LAGI";


        status.textContent =
          "⏳ Mencari data siswa...";


        /*
         * Getar sebentar jika HP mendukung
         */

        if (navigator.vibrate) {
          navigator.vibrate(120);
        }


        /*
         * Cari siswa ke Apps Script
         */

        await cariDataSiswa(kode);


        sedangMemproses = false;

      },

      {
        preferredCamera: "environment",
        highlightScanRegion: true,
        highlightCodeOutline: true,
        returnDetailedScanResult: true,
        maxScansPerSecond: 10
      }

    );


    /*
     * FUNGSI MENCARI SISWA KE APPS SCRIPT
     */

    async function cariDataSiswa(idSiswa) {

      try {

        const url =
          API_URL +
          "?action=cariSiswa&id=" +
          encodeURIComponent(idSiswa);


        const response =
          await fetch(url);


        if (!response.ok) {

          throw new Error(
            "Server tidak memberikan respons."
          );

        }


        const data =
          await response.json();


        /*
         * SISWA DITEMUKAN
         */

        if (
          data.berhasil &&
          data.ditemukan &&
          data.siswa
        ) {

          kotakHasil.style.display =
            "block";


          judulHasil.textContent =
            "✅ SISWA DITEMUKAN";


          judulHasil.className =
            "sukses";


          kodeQR.textContent =
            "ID QR: " + data.siswa.id;


          namaSiswa.textContent =
            data.siswa.nama;


          kelasSiswa.textContent =
            "Kelas " + data.siswa.kelas;


          status.textContent =
            "✅ Data siswa berhasil ditemukan.";


          if (navigator.vibrate) {

            navigator.vibrate([
              100,
              80,
              100
            ]);

          }


          return;
        }


        /*
         * SISWA TIDAK DITEMUKAN
         */

        kotakHasil.style.display =
          "block";


        judulHasil.textContent =
          "❌ SISWA TIDAK DITEMUKAN";


        judulHasil.className =
          "error";


        kodeQR.textContent =
          "QR terbaca: " + idSiswa;


        namaSiswa.textContent =
          "";


        kelasSiswa.textContent =
          "";


        status.textContent =
          data.pesan ||
          "ID QR tidak ditemukan di database.";


      } catch (error) {

        console.error(error);


        kotakHasil.style.display =
          "block";


        judulHasil.textContent =
          "⚠️ GAGAL TERHUBUNG";


        judulHasil.className =
          "error";


        kodeQR.textContent =
          "QR terbaca: " + idSiswa;


        namaSiswa.textContent =
          "";


        kelasSiswa.textContent =
          "";


        status.textContent =
          "❌ Tidak dapat terhubung ke server.";

      }

    }


    /*
     * TOMBOL MULAI / HENTIKAN SCANNER
     */

    tombolScan.addEventListener(
      "click",

      async function () {

        /*
         * Kalau scanner sedang aktif,
         * tombol digunakan untuk menghentikan
         */

        if (sedangScan) {

          scanner.stop();

          sedangScan = false;


          tombolScan.textContent =
            "📷 MULAI SCAN QR";


          status.textContent =
            "Scanner dihentikan.";


          return;
        }


        try {

          kotakHasil.style.display =
            "none";


          status.textContent =
            "Membuka kamera...";


          await scanner.start();


          sedangScan = true;

          sedangMemproses = false;


          tombolScan.textContent =
            "⏹ HENTIKAN SCANNER";


          status.textContent =
            "Arahkan kamera ke QR siswa.";


        } catch (error) {

          console.error(error);


          status.textContent =
            "❌ Kamera tidak dapat dibuka. Pastikan izin kamera diberikan.";

        }

      }

    );

  </script>

</body>
</html>
