<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Absensi Kegiatan Pagi</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7f5;
      color: #222;
      padding: 16px;
    }

    .container {
      max-width: 520px;
      margin: auto;
    }

    .header {
      text-align: center;
      margin-bottom: 18px;
    }

    h1 {
      color: #1b5e20;
      margin: 0 0 5px;
      font-size: 25px;
    }

    h2 {
      margin: 0;
      color: #555;
      font-size: 17px;
    }

    .tanggal {
      margin-top: 10px;
      color: #777;
      font-size: 14px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.07);
    }

    .login-title {
      text-align: center;
      color: #1b5e20;
      margin: 0 0 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      margin-top: 14px;
      font-weight: bold;
      font-size: 14px;
    }

    select,
    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 17px;
      background: white;
    }

    input {
      letter-spacing: 5px;
      text-align: center;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 16px;
      border: none;
      border-radius: 11px;
      background: #1b5e20;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button.stop {
      background: #b71c1c;
    }

    button.logout {
      width: auto;
      padding: 8px 14px;
      margin: 0;
      background: #eeeeee;
      color: #555;
      font-size: 13px;
    }

    .error-text {
      color: #b71c1c;
      text-align: center;
      margin-top: 12px;
    }

    .petugas-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding: 13px 15px;
      border-radius: 12px;
      background: #e8f5e9;
    }

    .petugas-nama {
      color: #1b5e20;
      font-weight: bold;
      margin-top: 3px;
    }

    .kecil {
      font-size: 12px;
      color: #777;
    }

    .jadwal-box {
      text-align: center;
    }

    .jadwal-label {
      font-size: 12px;
      color: #777;
      margin-bottom: 6px;
    }

    .kegiatan {
      color: #1b5e20;
      font-size: 25px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .jam-kegiatan {
      font-size: 17px;
      margin-bottom: 10px;
    }

    .status-waktu {
      display: inline-block;
      padding: 8px 13px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
    }

    .berlangsung {
      background: #e8f5e9;
      color: #1b5e20;
    }

    .terlambat {
      background: #fff3e0;
      color: #e65100;
    }

    .tidak-ada {
      background: #eeeeee;
      color: #555;
    }

    .counter {
      text-align: center;
      padding: 12px;
      background: white;
      border-radius: 12px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      color: #555;
    }

    .counter strong {
      display: inline-block;
      color: #1b5e20;
      font-size: 21px;
      margin-left: 4px;
    }

    .camera-box {
      position: relative;
      overflow: hidden;
      border-radius: 15px;
      background: black;
    }

    video {
      display: block;
      width: 100%;
      min-height: 290px;
      object-fit: cover;
    }

    #statusScanner {
      min-height: 24px;
      text-align: center;
      margin: 12px 0 0;
      line-height: 1.5;
    }

    .hasil {
      display: none;
      text-align: center;
      background: white;
      border-radius: 15px;
      padding: 20px;
      margin-top: 16px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .hasil h3 {
      margin: 0 0 10px;
      font-size: 21px;
    }

    .kode {
      font-size: 13px;
      color: #777;
      margin-bottom: 10px;
    }

    .nama-siswa {
      font-size: 23px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .kelas-siswa {
      font-size: 18px;
      color: #555;
      margin-bottom: 8px;
    }

    .detail {
      color: #555;
      line-height: 1.6;
      font-size: 15px;
    }

    .sukses {
      color: #1b5e20;
    }

    .peringatan {
      color: #e65100;
    }

    .gagal {
      color: #b71c1c;
    }

    #halamanAplikasi {
      display: none;
    }

    #loadingGuru {
      text-align: center;
      color: #777;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>SMP ISLAM CIPAKU</h1>
    <h2>ABSENSI KEGIATAN PAGI</h2>

    <div class="tanggal" id="tanggalHariIni"></div>
  </div>


  <!-- ===============================
       HALAMAN LOGIN
  ================================ -->

  <div id="halamanLogin">

    <div class="card">

      <h3 class="login-title">
        LOGIN PETUGAS
      </h3>

      <div id="loadingGuru">
        Memuat daftar guru...
      </div>

      <div id="formLogin" style="display:none;">

        <label>
          Nama Guru
        </label>

        <select id="pilihGuru">
          <option value="">
            -- Pilih nama guru --
          </option>
        </select>


        <label>
          PIN
        </label>

        <input
          id="inputPin"
          type="password"
          inputmode="numeric"
          maxlength="4"
          placeholder="••••"
        >


        <button id="tombolLogin">
          MASUK
        </button>

        <div
          class="error-text"
          id="pesanLogin"
        ></div>

      </div>

    </div>

  </div>


  <!-- ===============================
       APLIKASI
  ================================ -->

  <div id="halamanAplikasi">

    <div class="petugas-box">

      <div>
        <div class="kecil">
          PETUGAS
        </div>

        <div
          class="petugas-nama"
          id="namaPetugas"
        ></div>
      </div>

      <button
        class="logout"
        id="tombolLogout"
      >
        Keluar
      </button>

    </div>


    <div class="card jadwal-box">

      <div class="jadwal-label">
        KEGIATAN SAAT INI
      </div>

      <div
        class="kegiatan"
        id="namaKegiatan"
      >
        Memuat...
      </div>

      <div
        class="jam-kegiatan"
        id="jamKegiatan"
      ></div>

      <div
        class="status-waktu tidak-ada"
        id="statusWaktu"
      >
        Memuat jadwal...
      </div>

    </div>


    <div class="counter">
      Berhasil discan pada sesi ini:
      <strong id="jumlahScan">0</strong>
    </div>


    <div class="camera-box">
      <video id="qr-video"></video>
    </div>


    <button id="tombolScan">
      📷 MULAI SCAN
    </button>


    <p id="statusScanner">
      Kamera belum dinyalakan.
    </p>


    <div
      class="hasil"
      id="kotakHasil"
    >

      <h3 id="judulHasil"></h3>

      <div
        class="kode"
        id="kodeQR"
      ></div>

      <div
        class="nama-siswa"
        id="namaSiswa"
      ></div>

      <div
        class="kelas-siswa"
        id="kelasSiswa"
      ></div>

      <div
        class="detail"
        id="detailPresensi"
      ></div>

    </div>

  </div>

</div>


<script type="module">

import QrScanner from
"https://cdn.jsdelivr.net/npm/qr-scanner@1.4.2/qr-scanner.min.js";


/* ===============================
   BACKEND
================================ */

const API_URL =
"https://script.google.com/macros/s/AKfycbzMINLAmz6Wd5d5QvdDefkLNtmkECDPOFZg2D1YUhjS5uQKDys2gbqjG-0AAIIvyi6h-g/exec";


/* ===============================
   ELEMENT
================================ */

const halamanLogin =
  document.getElementById("halamanLogin");

const halamanAplikasi =
  document.getElementById("halamanAplikasi");

const loadingGuru =
  document.getElementById("loadingGuru");

const formLogin =
  document.getElementById("formLogin");

const pilihGuru =
  document.getElementById("pilihGuru");

const inputPin =
  document.getElementById("inputPin");

const tombolLogin =
  document.getElementById("tombolLogin");

const pesanLogin =
  document.getElementById("pesanLogin");

const namaPetugas =
  document.getElementById("namaPetugas");

const tombolLogout =
  document.getElementById("tombolLogout");

const video =
  document.getElementById("qr-video");

const tombolScan =
  document.getElementById("tombolScan");

const statusScanner =
  document.getElementById("statusScanner");

const kotakHasil =
  document.getElementById("kotakHasil");

const judulHasil =
  document.getElementById("judulHasil");

const kodeQR =
  document.getElementById("kodeQR");

const namaSiswa =
  document.getElementById("namaSiswa");

const kelasSiswa =
  document.getElementById("kelasSiswa");

const detailPresensi =
  document.getElementById("detailPresensi");

const jumlahScan =
  document.getElementById("jumlahScan");


/* ===============================
   VARIABLE
================================ */

let tokenLogin =
  localStorage.getItem(
    "absensi_token"
  ) || "";

let guruLogin =
  localStorage.getItem(
    "absensi_guru"
  ) || "";

let idGuruLogin =
  localStorage.getItem(
    "absensi_id_guru"
  ) || "";

let kegiatanAktif = "";

let scannerAktif = false;

let sedangMemproses = false;

let totalBerhasil = 0;


/* ===============================
   TANGGAL
================================ */

function tampilkanTanggal() {

  document
    .getElementById(
      "tanggalHariIni"
    )
    .textContent =
      new Date()
        .toLocaleDateString(
          "id-ID",
          {
            weekday: "long",
            day: "numeric",
            month: "long",
            year: "numeric"
          }
        );

}


/* ===============================
   LOAD GURU
================================ */

async function muatGuru() {

  try {

    const response =
      await fetch(
        API_URL +
        "?action=daftarGuru"
      );

    const data =
      await response.json();


    pilihGuru.innerHTML =
      '<option value="">-- Pilih nama guru --</option>';


    if (
      !data.berhasil ||
      !Array.isArray(data.data)
    ) {

      throw new Error(
        "Daftar guru tidak tersedia."
      );

    }


    data.data.forEach(
      function(guru) {

        const option =
          document.createElement(
            "option"
          );

        option.value =
          guru.id;

        option.textContent =
          guru.nama;

        pilihGuru.appendChild(
          option
        );

      }
    );


    loadingGuru.style.display =
      "none";

    formLogin.style.display =
      "block";


  } catch (error) {

    console.error(error);

    loadingGuru.textContent =
      "❌ Gagal memuat daftar guru.";

  }

}


/* ===============================
   LOGIN
================================ */

tombolLogin.addEventListener(
  "click",

  async function() {

    const idGuru =
      pilihGuru.value;

    const pin =
      inputPin.value.trim();


    if (!idGuru) {

      pesanLogin.textContent =
        "Silakan pilih nama guru.";

      return;

    }


    if (!pin) {

      pesanLogin.textContent =
        "Silakan masukkan PIN.";

      return;

    }


    tombolLogin.disabled =
      true;

    tombolLogin.textContent =
      "MEMERIKSA...";

    pesanLogin.textContent =
      "";


    try {

      const response =
        await fetch(
          API_URL,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "text/plain;charset=UTF-8"
            },

            body:
              JSON.stringify({
                action:
                  "loginGuru",

                idGuru:
                  idGuru,

                pin:
                  pin
              })
          }
        );


      const data =
        await response.json();


      if (!data.berhasil) {

        pesanLogin.textContent =
          data.pesan ||
          "Login gagal.";

        return;

      }


      tokenLogin =
        data.token;

      guruLogin =
        data.guru.nama;

      idGuruLogin =
        data.guru.id;


      localStorage.setItem(
        "absensi_token",
        tokenLogin
      );

      localStorage.setItem(
        "absensi_guru",
        guruLogin
      );

      localStorage.setItem(
        "absensi_id_guru",
        idGuruLogin
      );


      inputPin.value = "";


      bukaAplikasi();


    } catch (error) {

      console.error(error);

      pesanLogin.textContent =
        "Tidak dapat terhubung ke server.";

    } finally {

      tombolLogin.disabled =
        false;

      tombolLogin.textContent =
        "MASUK";

    }

  }
);


/* ENTER PADA PIN = LOGIN */

inputPin.addEventListener(
  "keydown",

  function(event) {

    if (
      event.key === "Enter"
    ) {

      tombolLogin.click();

    }

  }
);


/* ===============================
   TAMPILKAN APLIKASI
================================ */

function bukaAplikasi() {

  halamanLogin.style.display =
    "none";

  halamanAplikasi.style.display =
    "block";


  namaPetugas.textContent =
    guruLogin;


  ambilKegiatanSekarang();

}


/* ===============================
   LOGOUT
================================ */

tombolLogout.addEventListener(
  "click",

  async function() {

    scannerAktif = false;

    sedangMemproses = false;

    scanner.stop();


    try {

      if (tokenLogin) {

        await fetch(
          API_URL,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "text/plain;charset=UTF-8"
            },

            body:
              JSON.stringify({
                action:
                  "logoutGuru",

                token:
                  tokenLogin
              })
          }
        );

      }

    } catch (error) {

      console.error(error);

    }


    hapusLogin();

  }
);


function hapusLogin() {

  tokenLogin = "";
  guruLogin = "";
  idGuruLogin = "";

  localStorage.removeItem(
    "absensi_token"
  );

  localStorage.removeItem(
    "absensi_guru"
  );

  localStorage.removeItem(
    "absensi_id_guru"
  );


  halamanAplikasi.style.display =
    "none";

  halamanLogin.style.display =
    "block";


  pilihGuru.value = "";
  inputPin.value = "";

  pesanLogin.textContent = "";

}


/* ===============================
   JADWAL
================================ */

async function ambilKegiatanSekarang() {

  const namaKegiatan =
    document.getElementById(
      "namaKegiatan"
    );

  const jamKegiatan =
    document.getElementById(
      "jamKegiatan"
    );

  const statusWaktu =
    document.getElementById(
      "statusWaktu"
    );


  try {

    const response =
      await fetch(
        API_URL +
        "?action=kegiatanSekarang"
      );


    const data =
      await response.json();


    if (
      data.berhasil &&
      data.adaKegiatan
    ) {

      kegiatanAktif =
        data.kegiatan;


      namaKegiatan.textContent =
        data.kegiatan;


      jamKegiatan.textContent =
        data.mulai +
        " - " +
        data.tutup;


      if (
        data.statusWaktu ===
        "SEDANG BERLANGSUNG"
      ) {

        statusWaktu.textContent =
          "🟢 ABSENSI DIBUKA";

        statusWaktu.className =
          "status-waktu berlangsung";

      } else {

        statusWaktu.textContent =
          "🟠 TERLAMBAT";

        statusWaktu.className =
          "status-waktu terlambat";

      }


      return;

    }


    kegiatanAktif = "";


    namaKegiatan.textContent =
      "Tidak Ada Kegiatan";


    jamKegiatan.textContent =
      "";


    statusWaktu.textContent =
      data.pesan ||
      "Tidak ada kegiatan saat ini.";


    statusWaktu.className =
      "status-waktu tidak-ada";


  } catch (error) {

    console.error(error);


    kegiatanAktif = "";


    namaKegiatan.textContent =
      "Gagal Memuat Jadwal";


    jamKegiatan.textContent =
      "";


    statusWaktu.textContent =
      "Tidak dapat terhubung ke server.";


    statusWaktu.className =
      "status-waktu tidak-ada";

  }

}


/* ===============================
   SCANNER
================================ */

const scanner =
  new QrScanner(

    video,

    async hasil => {

      if (
        sedangMemproses ||
        !scannerAktif
      ) {

        return;

      }


      sedangMemproses =
        true;


      const kode =
        String(
          hasil.data || ""
        ).trim();


      await scanner.pause();


      statusScanner.textContent =
        "⏳ Memproses presensi...";


      if (navigator.vibrate) {

        navigator.vibrate(80);

      }


      await prosesPresensi(
        kode
      );


      /*
       * Beri guru waktu melihat hasil.
       */

      await tunggu(1500);


      /*
       * Otomatis scan siswa berikutnya.
       */

      if (scannerAktif) {

        kotakHasil.style.display =
          "none";


        statusScanner.textContent =
          "📷 Siap scan siswa berikutnya.";


        sedangMemproses =
          false;


        await scanner.start();

      } else {

        sedangMemproses =
          false;

      }

    },

    {
      preferredCamera:
        "environment",

      highlightScanRegion:
        true,

      highlightCodeOutline:
        true,

      returnDetailedScanResult:
        true,

      maxScansPerSecond:
        10
    }

  );


/* ===============================
   START / STOP SCANNER
================================ */

tombolScan.addEventListener(
  "click",

  async function() {

    /*
     * STOP
     */

    if (scannerAktif) {

      scannerAktif =
        false;

      sedangMemproses =
        false;


      scanner.stop();


      tombolScan.textContent =
        "📷 MULAI SCAN";

      tombolScan.className =
        "";


      statusScanner.textContent =
        "Scanner dihentikan.";


      return;

    }


    /*
     * TIDAK ADA KEGIATAN
     */

    if (!kegiatanAktif) {

      statusScanner.textContent =
        "❌ Tidak ada kegiatan aktif saat ini.";

      return;

    }


    /*
     * START
     */

    try {

      kotakHasil.style.display =
        "none";


      statusScanner.textContent =
        "Membuka kamera...";


      await scanner.start();


      scannerAktif =
        true;

      sedangMemproses =
        false;


      tombolScan.textContent =
        "⏹ SELESAI SCAN";

      tombolScan.className =
        "stop";


      statusScanner.textContent =
        "📷 Arahkan kamera ke QR siswa.";


    } catch (error) {

      console.error(error);


      statusScanner.textContent =
        "❌ Kamera tidak dapat dibuka.";

    }

  }
);


/* ===============================
   PROSES PRESENSI
================================ */

async function prosesPresensi(
  idSiswa
) {

  try {

    if (!kegiatanAktif) {

      tampilkanGagal(
        idSiswa,
        "Tidak ada kegiatan aktif."
      );

      return;

    }


    const response =
      await fetch(
        API_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "text/plain;charset=UTF-8"
          },

          body:
            JSON.stringify({

              action:
                "catatPresensi",

              idSiswa:
                idSiswa,

              kegiatan:
                kegiatanAktif,

              token:
                tokenLogin

            })
        }
      );


    const data =
      await response.json();


    /*
     * SESSION HABIS
     */

    if (data.harusLogin) {

      scannerAktif =
        false;

      scanner.stop();


      alert(
        "Sesi login telah habis. Silakan login kembali."
      );


      hapusLogin();

      return;

    }


    /*
     * BERHASIL
     */

    if (data.berhasil) {

      totalBerhasil++;


      jumlahScan.textContent =
        totalBerhasil;


      kotakHasil.style.display =
        "block";


      judulHasil.textContent =
        "✅ PRESENSI BERHASIL";


      judulHasil.className =
        "sukses";


      kodeQR.textContent =
        "ID QR: " +
        idSiswa;


      namaSiswa.textContent =
        data.nama || "";


      kelasSiswa.textContent =
        data.kelas
          ? "Kelas " +
            data.kelas
          : "";


      detailPresensi.innerHTML =

        "Kegiatan: <b>" +
        data.kegiatan +
        "</b><br>" +

        "Status: <b>" +
        data.status +
        "</b><br>" +

        "Jam: <b>" +
        data.jam +
        "</b><br>" +

        "Petugas: <b>" +
        data.petugas +
        "</b>";


      statusScanner.textContent =
        "✅ Presensi berhasil disimpan.";


      if (navigator.vibrate) {

        navigator.vibrate(
          [80, 60, 80]
        );

      }


      bunyiBerhasil();


      return;

    }


    /*
     * SUDAH ABSEN
     */

    if (data.sudahAbsen) {

      kotakHasil.style.display =
        "block";


      judulHasil.textContent =
        "⚠️ SUDAH ABSEN";


      judulHasil.className =
        "peringatan";


      kodeQR.textContent =
        "ID QR: " +
        idSiswa;


      namaSiswa.textContent =
        data.nama || "";


      kelasSiswa.textContent =
        data.kelas
          ? "Kelas " +
            data.kelas
          : "";


      detailPresensi.innerHTML =

        "Kegiatan: <b>" +
        kegiatanAktif +
        "</b><br>" +

        "Sudah tercatat pukul: <b>" +
        (
          data.jamSebelumnya ||
          "-"
        ) +
        "</b>";


      statusScanner.textContent =
        "⚠️ Siswa sudah melakukan presensi.";


      if (navigator.vibrate) {

        navigator.vibrate(
          [250, 80, 250]
        );

      }


      bunyiPeringatan();


      return;

    }


    /*
     * ERROR BIASA
     */

    tampilkanGagal(
      idSiswa,
      data.pesan ||
      "Presensi gagal."
    );


  } catch (error) {

    console.error(error);


    tampilkanGagal(
      idSiswa,
      "Tidak dapat terhubung ke server."
    );

  }

}


/* ===============================
   ERROR
================================ */

function tampilkanGagal(
  idSiswa,
  pesan
) {

  kotakHasil.style.display =
    "block";


  judulHasil.textContent =
    "❌ PRESENSI GAGAL";


  judulHasil.className =
    "gagal";


  kodeQR.textContent =
    "QR terbaca: " +
    idSiswa;


  namaSiswa.textContent =
    "";


  kelasSiswa.textContent =
    "";


  detailPresensi.textContent =
    pesan;


  statusScanner.textContent =
    pesan;


  if (navigator.vibrate) {

    navigator.vibrate(
      [300, 100, 300]
    );

  }

}


/* ===============================
   DELAY
================================ */

function tunggu(ms) {

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );

}


/* ===============================
   SUARA
================================ */

function bunyiBerhasil() {

  try {

    const audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();


    const oscillator =
      audioContext
        .createOscillator();


    const gain =
      audioContext
        .createGain();


    oscillator.connect(gain);

    gain.connect(
      audioContext.destination
    );


    oscillator.frequency.value =
      850;


    gain.gain.value =
      0.08;


    oscillator.start();


    setTimeout(
      function() {

        oscillator.stop();

        audioContext.close();

      },
      120
    );


  } catch (error) {}

}


function bunyiPeringatan() {

  try {

    const audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();


    const oscillator =
      audioContext
        .createOscillator();


    const gain =
      audioContext
        .createGain();


    oscillator.connect(gain);

    gain.connect(
      audioContext.destination
    );


    oscillator.frequency.value =
      300;


    gain.gain.value =
      0.08;


    oscillator.start();


    setTimeout(
      function() {

        oscillator.stop();

        audioContext.close();

      },
      220
    );


  } catch (error) {}

}

muatGuru();
