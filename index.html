<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Absensi Kegiatan Pagi</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f7f5;
  color: #222;
  padding: 15px;
}

.container {
  max-width: 520px;
  margin: auto;
}

.header {
  text-align: center;
  margin-bottom: 16px;
}

h1 {
  margin: 0 0 4px;
  color: #1b5e20;
  font-size: 25px;
}

h2 {
  margin: 0;
  color: #555;
  font-size: 17px;
}

.tanggal {
  margin-top: 9px;
  color: #777;
  font-size: 14px;
}

.card {
  background: white;
  border-radius: 15px;
  padding: 18px;
  margin-bottom: 15px;
  box-shadow: 0 3px 10px rgba(0,0,0,.07);
}

label {
  display: block;
  font-weight: bold;
  margin: 13px 0 6px;
}

select,
input {
  width: 100%;
  padding: 13px;
  font-size: 16px;
  border: 1px solid #ccc;
  border-radius: 9px;
  background: white;
}

button {
  width: 100%;
  border: none;
  border-radius: 10px;
  padding: 15px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  background: #1b5e20;
  color: white;
  margin-top: 12px;
}

button.secondary {
  background: #eeeeee;
  color: #333;
}

button.active-menu {
  background: #1b5e20;
  color: white;
}

button.stop {
  background: #b71c1c;
}

button.logout {
  width: auto;
  margin: 0;
  padding: 8px 13px;
  font-size: 13px;
  background: #eee;
  color: #555;
}

.petugas {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #e8f5e9;
  padding: 12px 14px;
  border-radius: 12px;
  margin-bottom: 15px;
}

.petugas b {
  color: #1b5e20;
}

.jadwal {
  text-align: center;
}

.kegiatan {
  color: #1b5e20;
  font-size: 24px;
  font-weight: bold;
}

.status-waktu {
  display: inline-block;
  margin-top: 8px;
  padding: 7px 12px;
  border-radius: 18px;
  font-size: 13px;
  font-weight: bold;
}

.buka {
  background: #e8f5e9;
  color: #1b5e20;
}

.telat {
  background: #fff3e0;
  color: #e65100;
}

.tutup {
  background: #eee;
  color: #555;
}

.menu {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
  margin-bottom: 15px;
}

.menu button {
  margin: 0;
}

.camera-box {
  overflow: hidden;
  border-radius: 15px;
  background: #000;
}

video {
  width: 100%;
  min-height: 280px;
  display: block;
  object-fit: cover;
}

.status {
  text-align: center;
  min-height: 24px;
  margin-top: 11px;
}

.hasil {
  display: none;
  text-align: center;
  margin-top: 14px;
  background: white;
  border-radius: 14px;
  padding: 18px;
}

.hasil h3 {
  margin-top: 0;
}

.sukses {
  color: #1b5e20;
}

.warning {
  color: #e65100;
}

.error {
  color: #b71c1c;
}

.nama-siswa {
  font-size: 21px;
  font-weight: bold;
  margin: 7px 0;
}

.detail {
  color: #555;
  line-height: 1.6;
}

.counter {
  text-align: center;
  margin-bottom: 12px;
}

.counter strong {
  color: #1b5e20;
  font-size: 20px;
}

#halamanAplikasi,
#halamanManual {
  display: none;
}

.hasil-cari {
  margin-top: 12px;
}

.siswa-item {
  border: 1px solid #ddd;
  padding: 12px;
  border-radius: 10px;
  margin-bottom: 8px;
  cursor: pointer;
  background: white;
}

.siswa-item:hover {
  background: #f1f8f2;
}

.siswa-item.terpilih {
  border: 2px solid #1b5e20;
  background: #e8f5e9;
}

.siswa-item b {
  display: block;
  margin-bottom: 4px;
}

.siswa-item small {
  color: #666;
}

.pilihan-siswa {
  display: none;
  background: #e8f5e9;
  border-radius: 10px;
  padding: 13px;
  margin-top: 12px;
}

#alasanLain {
  display: none;
  margin-top: 8px;
}

</style>

</head>


<body>

<div class="container">

  <div class="header">

    <h1>SMP ISLAM CIPAKU</h1>

    <h2>ABSENSI KEGIATAN PAGI</h2>

    <div
      class="tanggal"
      id="tanggal"
    ></div>

  </div>


  <!-- LOGIN -->

  <div id="halamanLogin">

    <div class="card">

      <h3 style="text-align:center;color:#1b5e20;">
        LOGIN PETUGAS
      </h3>

      <div id="loadingGuru">
        Memuat daftar guru...
      </div>

      <div
        id="formLogin"
        style="display:none;"
      >

        <label>Nama Guru</label>

        <select id="guru">

          <option value="">
            -- Pilih nama guru --
          </option>

        </select>


        <label>PIN</label>

        <input
          id="pin"
          type="password"
          inputmode="numeric"
          maxlength="4"
          placeholder="••••"
        >


        <button id="login">
          MASUK
        </button>


        <div
          class="status error"
          id="pesanLogin"
        ></div>

      </div>

    </div>

  </div>


  <!-- APLIKASI -->

  <div id="halamanAplikasi">

    <div class="petugas">

      <div>
        <small>PETUGAS</small><br>
        <b id="namaPetugas"></b>
      </div>

      <button
        id="logout"
        class="logout"
      >
        Keluar
      </button>

    </div>


    <div class="card jadwal">

      <small>KEGIATAN SAAT INI</small>

      <div
        class="kegiatan"
        id="kegiatan"
      >
        Memuat...
      </div>

      <div id="jam"></div>

      <div
        id="statusWaktu"
        class="status-waktu tutup"
      >
        Memuat...
      </div>

    </div>


    <div class="menu">

      <button
        id="menuQR"
        class="active-menu"
      >
        📷 SCAN QR
      </button>

      <button
        id="menuManual"
        class="secondary"
      >
        ✍️ ABSEN MANUAL
      </button>

    </div>


    <!-- QR -->

    <div id="halamanQR">

      <div class="counter">

        Presensi sesi ini:
        <strong id="counter">0</strong>

      </div>


      <div class="camera-box">

        <video id="qr-video"></video>

      </div>


      <button id="mulaiScan">
        📷 MULAI SCAN
      </button>


      <div
        class="status"
        id="statusScanner"
      >
        Kamera belum dinyalakan.
      </div>


      <div
        class="hasil"
        id="hasilQR"
      >

        <h3 id="judulQR"></h3>

        <div id="idQR"></div>

        <div
          class="nama-siswa"
          id="namaQR"
        ></div>

        <div id="kelasQR"></div>

        <div
          class="detail"
          id="detailQR"
        ></div>

      </div>

    </div>


    <!-- MANUAL -->

    <div id="halamanManual">

      <div class="card">

        <h3 style="margin-top:0;">
          ✍️ Absen Manual
        </h3>

        <p style="color:#666;">
          Cari berdasarkan nama, NIS,
          atau ID siswa.
        </p>


        <input
          id="pencarian"
          type="text"
          placeholder="Contoh: Abgari / 12345 / S001"
        >


        <button id="cariSiswa">
          🔎 CARI SISWA
        </button>


        <div
          class="hasil-cari"
          id="hasilCari"
        ></div>


        <div
          class="pilihan-siswa"
          id="pilihanSiswa"
        >

          <small>SISWA TERPILIH</small>

          <div
            class="nama-siswa"
            id="namaManual"
          ></div>

          <div id="kelasManual"></div>

        </div>


        <div id="formManual"
        style="display:none;">

          <label>
            Alasan Absen Manual
          </label>

          <select id="alasan">

            <option value="Lupa membawa kartu">
              Lupa membawa kartu
            </option>

            <option value="Kartu hilang">
              Kartu hilang
            </option>

            <option value="Kartu rusak">
              Kartu rusak
            </option>

            <option value="QR tidak terbaca">
              QR tidak terbaca
            </option>

            <option value="Lainnya">
              Lainnya
            </option>

          </select>


          <input
            id="alasanLain"
            type="text"
            placeholder="Tuliskan alasan..."
          >


          <button id="simpanManual">
            ✅ CATAT PRESENSI
          </button>

        </div>


        <div
          class="hasil"
          id="hasilManual"
        >

          <h3 id="judulManual"></h3>

          <div
            class="nama-siswa"
            id="hasilNamaManual"
          ></div>

          <div id="hasilKelasManual"></div>

          <div
            class="detail"
            id="detailManual"
          ></div>

        </div>

      </div>

    </div>

  </div>

</div>


<script type="module">

import QrScanner from
"https://cdn.jsdelivr.net/npm/qr-scanner@1.4.2/qr-scanner.min.js";


const API =
"https://script.google.com/macros/s/AKfycbzMINLAmz6Wd5d5QvdDefkLNtmkECDPOFZg2D1YUhjS5uQKDys2gbqjG-0AAIIvyi6h-g/exec";


let token =
  localStorage.getItem(
    "absensi_token"
  ) || "";


let namaGuru =
  localStorage.getItem(
    "absensi_guru"
  ) || "";


let kegiatanAktif = "";

let scannerAktif = false;

let proses = false;

let total = 0;

let siswaTerpilih = null;


/* TANGGAL */

document.getElementById(
  "tanggal"
).textContent =
  new Date()
    .toLocaleDateString(
      "id-ID",
      {
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric"
      }
    );


/* LOAD GURU */

async function loadGuru() {

  try {

    const r =
      await fetch(
        API +
        "?action=daftarGuru"
      );


    const d =
      await r.json();


    const guru =
      document.getElementById(
        "guru"
      );


    d.data.forEach(
      x => {

        const o =
          document.createElement(
            "option"
          );

        o.value =
          x.id;

        o.textContent =
          x.nama;

        guru.appendChild(o);

      }
    );


    document.getElementById(
      "loadingGuru"
    ).style.display =
      "none";


    document.getElementById(
      "formLogin"
    ).style.display =
      "block";


  } catch {

    document.getElementById(
      "loadingGuru"
    ).textContent =
      "Gagal memuat guru.";

  }

}


loadGuru();


/* LOGIN */

document.getElementById(
  "login"
).onclick =
async function() {

  const idGuru =
    document.getElementById(
      "guru"
    ).value;


  const pin =
    document.getElementById(
      "pin"
    ).value;


  const pesan =
    document.getElementById(
      "pesanLogin"
    );


  pesan.textContent = "";


  if (
    !idGuru ||
    !pin
  ) {

    pesan.textContent =
      "Pilih guru dan masukkan PIN.";

    return;

  }


  const r =
    await post({
      action: "loginGuru",
      idGuru,
      pin
    });


  if (!r.berhasil) {

    pesan.textContent =
      r.pesan;

    return;

  }


  token = r.token;

  namaGuru =
    r.guru.nama;


  localStorage.setItem(
    "absensi_token",
    token
  );


  localStorage.setItem(
    "absensi_guru",
    namaGuru
  );


  bukaAplikasi();

};


/* ENTER PIN */

document.getElementById(
  "pin"
).addEventListener(
  "keydown",
  e => {

    if (
      e.key === "Enter"
    ) {

      document
        .getElementById(
          "login"
        )
        .click();

    }

  }
);


/* BUKA APP */

function bukaAplikasi() {

  document.getElementById(
    "halamanLogin"
  ).style.display =
    "none";


  document.getElementById(
    "halamanAplikasi"
  ).style.display =
    "block";


  document.getElementById(
    "namaPetugas"
  ).textContent =
    namaGuru;


  loadKegiatan();

}


if (
  token &&
  namaGuru
) {

  bukaAplikasi();

}


/* LOGOUT */

document.getElementById(
  "logout"
).onclick =
async function() {

  scannerAktif = false;

  scanner.stop();


  await post({
    action: "logoutGuru",
    token
  });


  localStorage.clear();

  location.reload();

};


/* JADWAL */

async function loadKegiatan() {

  try {

    const r =
      await fetch(
        API +
        "?action=kegiatanSekarang"
      );


    const d =
      await r.json();


    const kegiatan =
      document.getElementById(
        "kegiatan"
      );


    const jam =
      document.getElementById(
        "jam"
      );


    const sw =
      document.getElementById(
        "statusWaktu"
      );


    if (
      d.berhasil &&
      d.adaKegiatan
    ) {

      kegiatanAktif =
        d.kegiatan;


      kegiatan.textContent =
        d.kegiatan;


      jam.textContent =
        d.mulai +
        " - " +
        d.tutup;


      if (
        d.statusWaktu ===
        "SEDANG BERLANGSUNG"
      ) {

        sw.textContent =
          "🟢 ABSENSI DIBUKA";

        sw.className =
          "status-waktu buka";

      } else {

        sw.textContent =
          "🟠 TERLAMBAT";

        sw.className =
          "status-waktu telat";

      }


      return;

    }


    kegiatanAktif = "";


    kegiatan.textContent =
      "Tidak Ada Kegiatan";


    jam.textContent = "";


    sw.textContent =
      d.pesan ||
      "Tidak ada kegiatan.";


    sw.className =
      "status-waktu tutup";


  } catch {

    kegiatanAktif = "";

  }

}


/* MENU */

document.getElementById(
  "menuQR"
).onclick =
function() {

  document.getElementById(
    "halamanQR"
  ).style.display =
    "block";


  document.getElementById(
    "halamanManual"
  ).style.display =
    "none";


  this.className =
    "active-menu";


  document.getElementById(
    "menuManual"
  ).className =
    "secondary";

};


document.getElementById(
  "menuManual"
).onclick =
function() {

  if (scannerAktif) {

    scannerAktif = false;

    scanner.stop();

    document.getElementById(
      "mulaiScan"
    ).textContent =
      "📷 MULAI SCAN";

  }


  document.getElementById(
    "halamanQR"
  ).style.display =
    "none";


  document.getElementById(
    "halamanManual"
  ).style.display =
    "block";


  this.className =
    "active-menu";


  document.getElementById(
    "menuQR"
  ).className =
    "secondary";

};


/* QR SCANNER */

const scanner =
new QrScanner(

  document.getElementById(
    "qr-video"
  ),

  async hasil => {

    if (
      proses ||
      !scannerAktif
    ) return;


    proses = true;


    await scanner.pause();


    await catatQR(
      String(
        hasil.data
      ).trim()
    );


    await delay(
      1500
    );


    if (scannerAktif) {

      document.getElementById(
        "hasilQR"
      ).style.display =
        "none";


      proses = false;


      await scanner.start();

    } else {

      proses = false;

    }

  },

  {
    preferredCamera:
      "environment",

    highlightScanRegion:
      true,

    highlightCodeOutline:
      true,

    returnDetailedScanResult:
      true
  }

);


/* START SCAN */

document.getElementById(
  "mulaiScan"
).onclick =
async function() {

  if (scannerAktif) {

    scannerAktif = false;

    scanner.stop();


    this.textContent =
      "📷 MULAI SCAN";


    this.className = "";


    return;

  }


  if (!kegiatanAktif) {

    document.getElementById(
      "statusScanner"
    ).textContent =
      "❌ Tidak ada kegiatan aktif.";

    return;

  }


  try {

    await scanner.start();


    scannerAktif = true;


    this.textContent =
      "⏹ SELESAI SCAN";


    this.className =
      "stop";


    document.getElementById(
      "statusScanner"
    ).textContent =
      "Arahkan kamera ke QR siswa.";


  } catch {

    document.getElementById(
      "statusScanner"
    ).textContent =
      "Kamera gagal dibuka.";

  }

};


/* CATAT QR */

async function catatQR(
  id
) {

  const d =
    await post({

      action:
        "catatPresensi",

      idSiswa: id,

      kegiatan:
        kegiatanAktif,

      token: token,

      metode: "QR",

      alasan: "-"

    });


  tampilkanHasilQR(
    id,
    d
  );

}


/* HASIL QR */

function tampilkanHasilQR(
  id,
  d
) {

  const box =
    document.getElementById(
      "hasilQR"
    );


  box.style.display =
    "block";


  if (d.harusLogin) {

    alert(
      "Sesi login habis."
    );

    localStorage.clear();

    location.reload();

    return;

  }


  if (d.berhasil) {

    total++;


    document.getElementById(
      "counter"
    ).textContent =
      total;


    document.getElementById(
      "judulQR"
    ).textContent =
      "✅ PRESENSI BERHASIL";


    document.getElementById(
      "judulQR"
    ).className =
      "sukses";


    document.getElementById(
      "namaQR"
    ).textContent =
      d.nama;


    document.getElementById(
      "kelasQR"
    ).textContent =
      "Kelas " +
      d.kelas;


    document.getElementById(
      "idQR"
    ).textContent =
      id;


    document.getElementById(
      "detailQR"
    ).innerHTML =
      "Status: <b>" +
      d.status +
      "</b><br>" +
      "Jam: <b>" +
      d.jam +
      "</b><br>" +
      "Petugas: <b>" +
      d.petugas +
      "</b>";


    getar(
      [80,60,80]
    );


  } else if (
    d.sudahAbsen
  ) {

    document.getElementById(
      "judulQR"
    ).textContent =
      "⚠️ SUDAH ABSEN";


    document.getElementById(
      "judulQR"
    ).className =
      "warning";


    document.getElementById(
      "namaQR"
    ).textContent =
      d.nama;


    document.getElementById(
      "kelasQR"
    ).textContent =
      "Kelas " +
      d.kelas;


    document.getElementById(
      "detailQR"
    ).innerHTML =
      "Sudah tercatat pukul <b>" +
      d.jamSebelumnya +
      "</b>";


    getar(
      [250,80,250]
    );


  } else {

    document.getElementById(
      "judulQR"
    ).textContent =
      "❌ GAGAL";


    document.getElementById(
      "judulQR"
    ).className =
      "error";


    document.getElementById(
      "namaQR"
    ).textContent =
      "";


    document.getElementById(
      "kelasQR"
    ).textContent =
      "";


    document.getElementById(
      "detailQR"
    ).textContent =
      d.pesan;

  }

}


/* ==========================
   ABSEN MANUAL
========================== */


/* ALASAN LAIN */

document.getElementById(
  "alasan"
).onchange =
function() {

  document.getElementById(
    "alasanLain"
  ).style.display =
    this.value ===
    "Lainnya"
      ? "block"
      : "none";

};


/* CARI SISWA */

document.getElementById(
  "cariSiswa"
).onclick =
async function() {

  const query =
    document.getElementById(
      "pencarian"
    ).value.trim();


  const tempat =
    document.getElementById(
      "hasilCari"
    );


  siswaTerpilih = null;


  document.getElementById(
    "pilihanSiswa"
  ).style.display =
    "none";


  document.getElementById(
    "formManual"
  ).style.display =
    "none";


  if (
    query.length < 2
  ) {

    tempat.innerHTML =
      '<div class="error">Ketik minimal 2 karakter.</div>';

    return;

  }


  tempat.innerHTML =
    "Mencari siswa...";


  const d =
    await post({

      action:
        "cariSiswaManual",

      query: query,

      token: token

    });


  if (d.harusLogin) {

    localStorage.clear();

    location.reload();

    return;

  }


  if (
    !d.berhasil
  ) {

    tempat.textContent =
      d.pesan;

    return;

  }


  if (
    d.data.length === 0
  ) {

    tempat.innerHTML =
      '<div class="error">Siswa tidak ditemukan.</div>';

    return;

  }


  tempat.innerHTML = "";


  d.data.forEach(
    siswa => {

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "siswa-item";


      div.innerHTML =
        "<b>" +
        siswa.nama +
        "</b>" +
        "<small>" +
        siswa.kelas +
        " • NIS: " +
        siswa.nis +
        " • " +
        siswa.id +
        "</small>";


      div.onclick =
      function() {

        document
          .querySelectorAll(
            ".siswa-item"
          )
          .forEach(
            e =>
              e.classList
                .remove(
                  "terpilih"
                )
          );


        div.classList.add(
          "terpilih"
        );


        siswaTerpilih =
          siswa;


        document.getElementById(
          "namaManual"
        ).textContent =
          siswa.nama;


        document.getElementById(
          "kelasManual"
        ).textContent =
          "Kelas " +
          siswa.kelas +
          " • " +
          siswa.id;


        document.getElementById(
          "pilihanSiswa"
        ).style.display =
          "block";


        document.getElementById(
          "formManual"
        ).style.display =
          "block";

      };


      tempat.appendChild(
        div
      );

    }
  );

};


/* ENTER SEARCH */

document.getElementById(
  "pencarian"
).addEventListener(
  "keydown",
  e => {

    if (
      e.key === "Enter"
    ) {

      document.getElementById(
        "cariSiswa"
      ).click();

    }

  }
);


/* SIMPAN MANUAL */

document.getElementById(
  "simpanManual"
).onclick =
async function() {

  if (
    !siswaTerpilih
  ) return;


  if (
    !kegiatanAktif
  ) {

    alert(
      "Tidak ada kegiatan aktif."
    );

    return;

  }


  let alasan =
    document.getElementById(
      "alasan"
    ).value;


  if (
    alasan === "Lainnya"
  ) {

    alasan =
      document.getElementById(
        "alasanLain"
      ).value.trim();


    if (!alasan) {

      alert(
        "Tuliskan alasan."
      );

      return;

    }

  }


  this.disabled = true;

  this.textContent =
    "MENYIMPAN...";


  const d =
    await post({

      action:
        "catatPresensi",

      idSiswa:
        siswaTerpilih.id,

      kegiatan:
        kegiatanAktif,

      token: token,

      metode:
        "MANUAL",

      alasan:
        alasan

    });


  this.disabled = false;

  this.textContent =
    "✅ CATAT PRESENSI";


  tampilkanManual(d);

};


/* HASIL MANUAL */

function tampilkanManual(
  d
) {

  const box =
    document.getElementById(
      "hasilManual"
    );


  box.style.display =
    "block";


  if (
    d.harusLogin
  ) {

    localStorage.clear();

    location.reload();

    return;

  }


  if (d.berhasil) {

    total++;


    document.getElementById(
      "counter"
    ).textContent =
      total;


    document.getElementById(
      "judulManual"
    ).textContent =
      "✅ PRESENSI MANUAL BERHASIL";


    document.getElementById(
      "judulManual"
    ).className =
      "sukses";


    document.getElementById(
      "hasilNamaManual"
    ).textContent =
      d.nama;


    document.getElementById(
      "hasilKelasManual"
    ).textContent =
      "Kelas " +
      d.kelas;


    document.getElementById(
      "detailManual"
    ).innerHTML =
      "Status: <b>" +
      d.status +
      "</b><br>" +
      "Metode: <b>MANUAL</b><br>" +
      "Alasan: <b>" +
      d.alasan +
      "</b><br>" +
      "Petugas: <b>" +
      d.petugas +
      "</b>";


    getar(
      [80,60,80]
    );


  } else if (
    d.sudahAbsen
  ) {

    document.getElementById(
      "judulManual"
    ).textContent =
      "⚠️ SUDAH ABSEN";


    document.getElementById(
      "judulManual"
    ).className =
      "warning";


    document.getElementById(
      "hasilNamaManual"
    ).textContent =
      d.nama;


    document.getElementById(
      "hasilKelasManual"
    ).textContent =
      "Kelas " +
      d.kelas;


    document.getElementById(
      "detailManual"
    ).innerHTML =
      "Siswa sudah tercatat pukul <b>" +
      d.jamSebelumnya +
      "</b>";


  } else {

    document.getElementById(
      "judulManual"
    ).textContent =
      "❌ PRESENSI GAGAL";


    document.getElementById(
      "judulManual"
    ).className =
      "error";


    document.getElementById(
      "detailManual"
    ).textContent =
      d.pesan;

  }

}


/* POST */

async function post(
  data
) {

  try {

    const r =
      await fetch(
        API,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "text/plain;charset=UTF-8"
          },

          body:
            JSON.stringify(
              data
            )
        }
      );


    return await r.json();


  } catch {

    return {
      berhasil: false,
      pesan:
        "Tidak dapat terhubung ke server."
    };

  }

}


/* UTIL */

function delay(ms) {

  return new Promise(
    r =>
      setTimeout(
        r,
        ms
      )
  );

}


function getar(
  pola
) {

  if (
    navigator.vibrate
  ) {

    navigator.vibrate(
      pola
    );

  }

}

</script>
