<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Absensi Kegiatan Pagi</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7f5;
      color: #222;
      padding: 18px;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    .header {
      text-align: center;
      margin-bottom: 18px;
    }

    h1 {
      color: #1b5e20;
      margin: 0 0 4px;
      font-size: 25px;
    }

    h2 {
      font-size: 17px;
      color: #555;
      margin: 0;
    }

    .tanggal {
      margin-top: 12px;
      font-size: 14px;
      color: #666;
    }

    .jadwal-box {
      background: white;
      border-radius: 15px;
      padding: 18px;
      margin-bottom: 18px;
      text-align: center;
      box-shadow: 0 3px 12px rgba(0,0,0,0.07);
    }

    .jadwal-label {
      font-size: 13px;
      color: #777;
      margin-bottom: 7px;
    }

    .kegiatan {
      font-size: 24px;
      font-weight: bold;
      color: #1b5e20;
      margin-bottom: 7px;
    }

    .jam-kegiatan {
      font-size: 17px;
      margin-bottom: 10px;
    }

    .status-waktu {
      display: inline-block;
      padding: 8px 13px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
    }

    .berlangsung {
      background: #e8f5e9;
      color: #1b5e20;
    }

    .terlambat {
      background: #fff3e0;
      color: #e65100;
    }

    .tidak-ada {
      background: #eeeeee;
      color: #555;
    }

    .camera-box {
      position: relative;
      overflow: hidden;
      border-radius: 15px;
      background: #000;
    }

    video {
      width: 100%;
      display: block;
      min-height: 300px;
      object-fit: cover;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 18px;
      border: none;
      border-radius: 10px;
      background: #1b5e20;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #status {
      text-align: center;
      margin-top: 14px;
      font-size: 16px;
      line-height: 1.5;
    }

    .hasil {
      margin-top: 18px;
      padding: 22px;
      background: white;
      border-radius: 15px;
      display: none;
      text-align: center;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .hasil h3 {
      margin: 0 0 10px;
    }

    .kode-qr {
      font-size: 14px;
      color: #777;
      margin-bottom: 15px;
    }

    .nama {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .kelas {
      font-size: 18px;
      color: #555;
    }

    .error {
      color: #b71c1c;
    }

    .sukses {
      color: #1b5e20;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">

      <h1>SMP ISLAM CIPAKU</h1>
      <h2>ABSENSI KEGIATAN PAGI</h2>

      <div class="tanggal" id="tanggalHariIni">
        Memuat tanggal...
      </div>

    </div>


    <!-- INFORMASI KEGIATAN -->

    <div class="jadwal-box">

      <div class="jadwal-label">
        KEGIATAN
      </div>

      <div class="kegiatan" id="namaKegiatan">
        Memuat...
      </div>

      <div class="jam-kegiatan" id="jamKegiatan">
      </div>

      <div
        class="status-waktu tidak-ada"
        id="statusWaktu"
      >
        Memuat jadwal...
      </div>

    </div>


    <!-- KAMERA -->

    <div class="camera-box">
      <video id="qr-video"></video>
    </div>


    <button id="tombolScan">
      📷 MULAI SCAN QR
    </button>


    <p id="status">
      Kamera belum dinyalakan.
    </p>


    <!-- HASIL SISWA -->

    <div class="hasil" id="kotakHasil">

      <h3 id="judulHasil">
        DATA SISWA
      </h3>

      <div class="kode-qr" id="kodeQR"></div>

      <div class="nama" id="namaSiswa"></div>

      <div class="kelas" id="kelasSiswa"></div>

    </div>

  </div>


  <script type="module">

    import QrScanner from
    "https://cdn.jsdelivr.net/npm/qr-scanner@1.4.2/qr-scanner.min.js";


    const API_URL =
      "https://script.google.com/macros/s/AKfycbzMINLAmz6Wd5d5QvdDefkLNtmkECDPOFZg2D1YUhjS5uQKDys2gbqjG-0AAIIvyi6h-g/exec";


    const video =
      document.getElementById("qr-video");

    const tombolScan =
      document.getElementById("tombolScan");

    const status =
      document.getElementById("status");

    const kotakHasil =
      document.getElementById("kotakHasil");

    const judulHasil =
      document.getElementById("judulHasil");

    const kodeQR =
      document.getElementById("kodeQR");

    const namaSiswa =
      document.getElementById("namaSiswa");

    const kelasSiswa =
      document.getElementById("kelasSiswa");


    let sedangScan = false;
    let sedangMemproses = false;


    /*
     * TAMPILKAN TANGGAL
     */

    function tampilkanTanggal() {

      const sekarang = new Date();

      const hasil =
        sekarang.toLocaleDateString(
          "id-ID",
          {
            weekday: "long",
            day: "numeric",
            month: "long",
            year: "numeric"
          }
        );

      document
        .getElementById("tanggalHariIni")
        .textContent = hasil;

    }


    /*
     * AMBIL KEGIATAN DARI APPS SCRIPT
     */

    async function ambilKegiatanSekarang() {

      const namaKegiatan =
        document.getElementById("namaKegiatan");

      const jamKegiatan =
        document.getElementById("jamKegiatan");

      const statusWaktu =
        document.getElementById("statusWaktu");


      try {

        const response =
          await fetch(
            API_URL +
            "?action=kegiatanSekarang"
          );


        const data =
          await response.json();


        /*
         * ADA KEGIATAN
         */

        if (
          data.berhasil &&
          data.adaKegiatan
        ) {

          namaKegiatan.textContent =
            data.kegiatan;


          jamKegiatan.textContent =
            data.mulai +
            " - " +
            data.tutup;


          if (
            data.statusWaktu ===
            "SEDANG BERLANGSUNG"
          ) {

            statusWaktu.textContent =
              "🟢 ABSENSI DIBUKA";

            statusWaktu.className =
              "status-waktu berlangsung";

          }

          else if (
            data.statusWaktu ===
            "TERLAMBAT"
          ) {

            statusWaktu.textContent =
              "🟠 TERLAMBAT";

            statusWaktu.className =
              "status-waktu terlambat";

          }


          return;

        }


        /*
         * TIDAK ADA KEGIATAN
         */

        namaKegiatan.textContent =
          "Tidak Ada Kegiatan";


        jamKegiatan.textContent =
          "";


        statusWaktu.textContent =
          data.pesan ||
          "Tidak ada kegiatan saat ini.";


        statusWaktu.className =
          "status-waktu tidak-ada";


      } catch (error) {

        console.error(error);


        namaKegiatan.textContent =
          "Gagal memuat jadwal";


        jamKegiatan.textContent =
          "";


        statusWaktu.textContent =
          "Tidak dapat terhubung ke server.";


        statusWaktu.className =
          "status-waktu tidak-ada";

      }

    }


    /*
     * SCANNER QR
     */

    const scanner =
      new QrScanner(

        video,

        async hasil => {

          if (sedangMemproses) {
            return;
          }


          sedangMemproses = true;


          const kode =
            String(
              hasil.data || ""
            ).trim();


          scanner.stop();

          sedangScan = false;


          tombolScan.textContent =
            "📷 SCAN LAGI";


          status.textContent =
            "⏳ Mencari data siswa...";


          if (navigator.vibrate) {
            navigator.vibrate(120);
          }


          await cariDataSiswa(kode);


          sedangMemproses = false;

        },

        {
          preferredCamera: "environment",
          highlightScanRegion: true,
          highlightCodeOutline: true,
          returnDetailedScanResult: true,
          maxScansPerSecond: 10
        }

      );


    /*
     * CARI SISWA
     */

    async function cariDataSiswa(idSiswa) {

      try {

        const url =
          API_URL +
          "?action=cariSiswa&id=" +
          encodeURIComponent(idSiswa);


        const response =
          await fetch(url);


        const data =
          await response.json();


        if (
          data.berhasil &&
          data.ditemukan &&
          data.siswa
        ) {

          kotakHasil.style.display =
            "block";


          judulHasil.textContent =
            "✅ SISWA DITEMUKAN";


          judulHasil.className =
            "sukses";


          kodeQR.textContent =
            "ID QR: " +
            data.siswa.id;


          namaSiswa.textContent =
            data.siswa.nama;


          kelasSiswa.textContent =
            "Kelas " +
            data.siswa.kelas;


          status.textContent =
            "✅ Data siswa berhasil ditemukan.";


          if (navigator.vibrate) {

            navigator.vibrate([
              100,
              80,
              100
            ]);

          }


          return;

        }


        kotakHasil.style.display =
          "block";


        judulHasil.textContent =
          "❌ SISWA TIDAK DITEMUKAN";


        judulHasil.className =
          "error";


        kodeQR.textContent =
          "QR terbaca: " +
          idSiswa;


        namaSiswa.textContent =
          "";


        kelasSiswa.textContent =
          "";


        status.textContent =
          data.pesan ||
          "ID QR tidak ditemukan.";

      }

      catch (error) {

        console.error(error);


        kotakHasil.style.display =
          "block";


        judulHasil.textContent =
          "⚠️ GAGAL TERHUBUNG";


        judulHasil.className =
          "error";


        kodeQR.textContent =
          "QR terbaca: " +
          idSiswa;


        namaSiswa.textContent =
          "";


        kelasSiswa.textContent =
          "";


        status.textContent =
          "❌ Tidak dapat terhubung ke server.";

      }

    }


    /*
     * TOMBOL SCANNER
     */

    tombolScan.addEventListener(
      "click",

      async function () {

        if (sedangScan) {

          scanner.stop();

          sedangScan = false;


          tombolScan.textContent =
            "📷 MULAI SCAN QR";


          status.textContent =
            "Scanner dihentikan.";


          return;

        }


        try {

          kotakHasil.style.display =
            "none";


          status.textContent =
            "Membuka kamera...";


          await scanner.start();


          sedangScan = true;
          sedangMemproses = false;


          tombolScan.textContent =
            "⏹ HENTIKAN SCANNER";


          status.textContent =
            "Arahkan kamera ke QR siswa.";

        }

        catch (error) {

          console.error(error);


          status.textContent =
            "❌ Kamera tidak dapat dibuka. Pastikan izin kamera diberikan.";

        }

      }

    );


    /*
     * DIJALANKAN SAAT WEB DIBUKA
     */

    tampilkanTanggal();
    ambilKegiatanSekarang();

  </script>

</body>
</html>
