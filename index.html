<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Absensi Kegiatan Pagi</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7f5;
      color: #222;
      padding: 18px;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    .header {
      text-align: center;
      margin-bottom: 18px;
    }

    h1 {
      color: #1b5e20;
      margin: 0 0 4px;
      font-size: 25px;
    }

    h2 {
      font-size: 17px;
      color: #555;
      margin: 0;
    }

    .tanggal {
      margin-top: 12px;
      font-size: 14px;
      color: #666;
    }

    .jadwal-box {
      background: white;
      border-radius: 15px;
      padding: 18px;
      margin-bottom: 18px;
      text-align: center;
      box-shadow: 0 3px 12px rgba(0,0,0,0.07);
    }

    .jadwal-label {
      font-size: 13px;
      color: #777;
      margin-bottom: 7px;
    }

    .kegiatan {
      font-size: 24px;
      font-weight: bold;
      color: #1b5e20;
      margin-bottom: 7px;
    }

    .jam-kegiatan {
      font-size: 17px;
      margin-bottom: 10px;
    }

    .status-waktu {
      display: inline-block;
      padding: 8px 13px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
    }

    .berlangsung {
      background: #e8f5e9;
      color: #1b5e20;
    }

    .terlambat {
      background: #fff3e0;
      color: #e65100;
    }

    .tidak-ada {
      background: #eeeeee;
      color: #555;
    }

    .camera-box {
      position: relative;
      overflow: hidden;
      border-radius: 15px;
      background: #000;
    }

    video {
      width: 100%;
      display: block;
      min-height: 300px;
      object-fit: cover;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 18px;
      border: none;
      border-radius: 10px;
      background: #1b5e20;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #status {
      text-align: center;
      margin-top: 14px;
      font-size: 16px;
      line-height: 1.5;
    }

    .hasil {
      margin-top: 18px;
      padding: 22px;
      background: white;
      border-radius: 15px;
      display: none;
      text-align: center;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .hasil h3 {
      margin: 0 0 10px;
    }

    .kode-qr {
      font-size: 14px;
      color: #777;
      margin-bottom: 12px;
    }

    .nama {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .kelas {
      font-size: 18px;
      color: #555;
      margin-bottom: 8px;
    }

    .detail {
      font-size: 15px;
      color: #555;
      line-height: 1.6;
    }

    .sukses {
      color: #1b5e20;
    }

    .error {
      color: #b71c1c;
    }

    .peringatan {
      color: #e65100;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">

      <h1>SMP ISLAM CIPAKU</h1>
      <h2>ABSENSI KEGIATAN PAGI</h2>

      <div class="tanggal" id="tanggalHariIni">
        Memuat tanggal...
      </div>

    </div>


    <div class="jadwal-box">

      <div class="jadwal-label">
        KEGIATAN
      </div>

      <div class="kegiatan" id="namaKegiatan">
        Memuat...
      </div>

      <div class="jam-kegiatan" id="jamKegiatan">
      </div>

      <div class="status-waktu tidak-ada" id="statusWaktu">
        Memuat jadwal...
      </div>

    </div>


    <div class="camera-box">
      <video id="qr-video"></video>
    </div>


    <button id="tombolScan">
      📷 MULAI SCAN QR
    </button>


    <p id="status">
      Kamera belum dinyalakan.
    </p>


    <div class="hasil" id="kotakHasil">

      <h3 id="judulHasil"></h3>

      <div class="kode-qr" id="kodeQR"></div>

      <div class="nama" id="namaSiswa"></div>

      <div class="kelas" id="kelasSiswa"></div>

      <div class="detail" id="detailPresensi"></div>

    </div>

  </div>


  <script type="module">

    import QrScanner from
    "https://cdn.jsdelivr.net/npm/qr-scanner@1.4.2/qr-scanner.min.js";


    const API_URL =
      "https://script.google.com/macros/s/AKfycbzMINLAmz6Wd5d5QvdDefkLNtmkECDPOFZg2D1YUhjS5uQKDys2gbqjG-0AAIIvyi6h-g/exec";


    const video =
      document.getElementById("qr-video");

    const tombolScan =
      document.getElementById("tombolScan");

    const status =
      document.getElementById("status");

    const kotakHasil =
      document.getElementById("kotakHasil");

    const judulHasil =
      document.getElementById("judulHasil");

    const kodeQR =
      document.getElementById("kodeQR");

    const namaSiswa =
      document.getElementById("namaSiswa");

    const kelasSiswa =
      document.getElementById("kelasSiswa");

    const detailPresensi =
      document.getElementById("detailPresensi");


    let sedangScan = false;
    let sedangMemproses = false;
    let kegiatanAktif = "";


    function tampilkanTanggal() {

      const sekarang = new Date();

      document
        .getElementById("tanggalHariIni")
        .textContent =
        sekarang.toLocaleDateString(
          "id-ID",
          {
            weekday: "long",
            day: "numeric",
            month: "long",
            year: "numeric"
          }
        );

    }


    async function ambilKegiatanSekarang() {

      const namaKegiatan =
        document.getElementById("namaKegiatan");

      const jamKegiatan =
        document.getElementById("jamKegiatan");

      const statusWaktu =
        document.getElementById("statusWaktu");


      try {

        const response =
          await fetch(
            API_URL +
            "?action=kegiatanSekarang"
          );

        const data =
          await response.json();


        if (
          data.berhasil &&
          data.adaKegiatan
        ) {

          kegiatanAktif =
            data.kegiatan;


          namaKegiatan.textContent =
            data.kegiatan;


          jamKegiatan.textContent =
            data.mulai +
            " - " +
            data.tutup;


          if (
            data.statusWaktu ===
            "SEDANG BERLANGSUNG"
          ) {

            statusWaktu.textContent =
              "🟢 ABSENSI DIBUKA";

            statusWaktu.className =
              "status-waktu berlangsung";

          }

          else {

            statusWaktu.textContent =
              "🟠 TERLAMBAT";

            statusWaktu.className =
              "status-waktu terlambat";

          }

          return;

        }


        kegiatanAktif = "";


        namaKegiatan.textContent =
          "Tidak Ada Kegiatan";


        jamKegiatan.textContent =
          "";


        statusWaktu.textContent =
          data.pesan ||
          "Tidak ada kegiatan saat ini.";


        statusWaktu.className =
          "status-waktu tidak-ada";


      } catch (error) {

        console.error(error);


        kegiatanAktif = "";


        namaKegiatan.textContent =
          "Gagal memuat jadwal";


        jamKegiatan.textContent =
          "";


        statusWaktu.textContent =
          "Tidak dapat terhubung ke server.";


        statusWaktu.className =
          "status-waktu tidak-ada";

      }

    }


    const scanner =
      new QrScanner(

        video,

        async hasil => {

          if (sedangMemproses) {
            return;
          }


          sedangMemproses = true;


          const kode =
            String(
              hasil.data || ""
            ).trim();


          scanner.stop();

          sedangScan = false;


          tombolScan.textContent =
            "📷 SCAN LAGI";


          status.textContent =
            "⏳ Memproses presensi...";


          if (navigator.vibrate) {
            navigator.vibrate(120);
          }


          await prosesPresensi(kode);


          sedangMemproses = false;

        },

        {
          preferredCamera: "environment",
          highlightScanRegion: true,
          highlightCodeOutline: true,
          returnDetailedScanResult: true,
          maxScansPerSecond: 10
        }

      );


    async function prosesPresensi(idSiswa) {

      try {

        if (!kegiatanAktif) {

          tampilkanError(
            idSiswa,
            "Tidak ada kegiatan aktif."
          );

          return;

        }


        const dataKirim = {

          action:
            "catatPresensi",

          idSiswa:
            idSiswa,

          kegiatan:
            kegiatanAktif,

          petugas:
            "TEST HP"

        };


        const response =
          await fetch(
            API_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "text/plain;charset=UTF-8"
              },

              body:
                JSON.stringify(dataKirim)
            }
          );


        const data =
          await response.json();


        if (data.berhasil) {

          kotakHasil.style.display =
            "block";


          judulHasil.textContent =
            "✅ PRESENSI BERHASIL";


          judulHasil.className =
            "sukses";


          kodeQR.textContent =
            "ID QR: " +
            idSiswa;


          namaSiswa.textContent =
            data.nama || "";


          kelasSiswa.textContent =
            data.kelas
              ? "Kelas " + data.kelas
              : "";


          detailPresensi.innerHTML =
            "Kegiatan: <b>" +
            data.kegiatan +
            "</b><br>" +

            "Status: <b>" +
            data.status +
            "</b><br>" +

            "Jam: <b>" +
            data.jam +
            "</b>";


          status.textContent =
            "✅ Presensi berhasil disimpan.";


          if (navigator.vibrate) {

            navigator.vibrate([
              100,
              70,
              100
            ]);

          }


          return;

        }


        if (data.sudahAbsen) {

          kotakHasil.style.display =
            "block";


          judulHasil.textContent =
            "⚠️ SUDAH ABSEN";


          judulHasil.className =
            "peringatan";


          kodeQR.textContent =
            "ID QR: " +
            idSiswa;


          namaSiswa.textContent =
            data.nama || "";


          kelasSiswa.textContent =
            data.kelas
              ? "Kelas " + data.kelas
              : "";


          detailPresensi.innerHTML =
            "Kegiatan: <b>" +
            kegiatanAktif +
            "</b><br>" +

            "Sudah tercatat pukul: <b>" +
            (data.jamSebelumnya || "-") +
            "</b>";


          status.textContent =
            "Siswa tidak dicatat dua kali.";


          return;

        }


        tampilkanError(
          idSiswa,
          data.pesan ||
          "Presensi gagal."
        );


      } catch (error) {

        console.error(error);


        tampilkanError(
          idSiswa,
          "Tidak dapat terhubung ke server."
        );

      }

    }


    function tampilkanError(
      idSiswa,
      pesan
    ) {

      kotakHasil.style.display =
        "block";


      judulHasil.textContent =
        "❌ PRESENSI GAGAL";


      judulHasil.className =
        "error";


      kodeQR.textContent =
        "QR terbaca: " +
        idSiswa;


      namaSiswa.textContent =
        "";


      kelasSiswa.textContent =
        "";


      detailPresensi.textContent =
        pesan;


      status.textContent =
        pesan;

    }


    tombolScan.addEventListener(
      "click",

      async function () {

        if (sedangScan) {

          scanner.stop();

          sedangScan = false;


          tombolScan.textContent =
            "📷 MULAI SCAN QR";


          status.textContent =
            "Scanner dihentikan.";


          return;

        }


        if (!kegiatanAktif) {

          status.textContent =
            "❌ Tidak ada kegiatan aktif saat ini.";

          return;

        }


        try {

          kotakHasil.style.display =
            "none";


          status.textContent =
            "Membuka kamera...";


          await scanner.start();


          sedangScan = true;
          sedangMemproses = false;


          tombolScan.textContent =
            "⏹ HENTIKAN SCANNER";


          status.textContent =
            "Arahkan kamera ke QR siswa.";


        } catch (error) {

          console.error(error);


          status.textContent =
            "❌ Kamera tidak dapat dibuka. Pastikan izin kamera diberikan.";

        }

      }

    );


    tampilkanTanggal();

    ambilKegiatanSekarang();

  </script>

</body>
</html>
